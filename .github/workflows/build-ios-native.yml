name: Build native iOS IPA

on:
  push:
    branches: [codex/ios-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify canonical content and prepare the native bundle
        id: prepare
        run: |
          node tools/verify-content.mjs
          node build.mjs
          git diff --exit-code -- index.html index.offline.html sw.js docs/CONTENT-COVERAGE.md data/topics.json
          node native-ios/prepare-data.mjs
          python3 native-ios/prepare-project.py
      - name: Test native data decoding and map selection
        run: |
          swiftc native-ios/Sources/{HistoryData,Atlas,GlobeCamera,Search,Session}.swift native-ios/Smoke.swift -o "$RUNNER_TEMP/native-smoke"
          "$RUNNER_TEMP/native-smoke" native-ios/OfflineData
      - name: Build for physical iPhones
        if: steps.prepare.outcome == 'success' && !cancelled()
        run: |
          set -o pipefail
          xcodebuild -project native-ios/SpacetimeGlobe.xcodeproj -scheme SpacetimeGlobe \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/native-device" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/native-build.log" 2>&1 || { tail -n 220 "$RUNNER_TEMP/native-build.log"; exit 1; }
          tail -n 7 "$RUNNER_TEMP/native-build.log"
      - name: Verify and package the unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/native-device/Build/Products/Release-iphoneos/SpacetimeGlobe.app"
          [ "$(xcrun lipo -archs "$app/SpacetimeGlobe")" = arm64 ]
          xcrun vtool -show-build "$app/SpacetimeGlobe" | awk '$1=="platform" && $2=="IOS" { ok=1 } END { exit !ok }'
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = io.github.lllliam.spacetimeglobe.native ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/Info.plist")" = 16.0 ]
          "$RUNNER_TEMP/native-smoke" native-ios/OfflineData "$app"
          diff -qr native-ios/OfflineData "$app/OfflineData"
          ! find "$app" -iname '*.html' -print -quit | grep .
          ! xcrun otool -L "$app/SpacetimeGlobe" | grep WebKit.framework
          mkdir -p "$RUNNER_TEMP/native-package/Payload" native-ios/dist
          ditto "$app" "$RUNNER_TEMP/native-package/Payload/SpacetimeGlobe.app"
          dist="$GITHUB_WORKSPACE/native-ios/dist"
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")"
          ipa="SpacetimeGlobe-Native-$version-unsigned.ipa"
          (cd "$RUNNER_TEMP/native-package" && zip -q -r "$dist/$ipa" Payload)
          (cd "$dist" && shasum -a 256 "$ipa" > SHA256.txt)
          # Validate signing on a separate copy. The distribution IPA stays unsigned.
          ditto "$app" "$RUNNER_TEMP/signing-check.app"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/signing-check.app"
          codesign --verify --strict "$RUNNER_TEMP/signing-check.app"
      - uses: actions/upload-artifact@v4
        with:
          name: SpacetimeGlobe-Native-iOS-unsigned
          path: native-ios/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Exercise exploration, year selection, reading and observation on iPhone
        id: simulator
        timeout-minutes: 13
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].values()
          print(next(device["udid"] for runtime in reversed(list(devices)) for device in runtime if device["name"] == "iPhone 17 Pro"))
          ')"
          echo "Running the journey on $simulator"
          result=0
          xcodebuild -project native-ios/SpacetimeGlobe.xcodeproj -scheme SpacetimeGlobe \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath "$RUNNER_TEMP/native-sim" -resultBundlePath "$RUNNER_TEMP/Journey.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 225 \
            CODE_SIGN_IDENTITY=- ARCHS=arm64 test > "$RUNNER_TEMP/native-sim.log" 2>&1 || result=$?
          if [ -d "$RUNNER_TEMP/Journey.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Journey.xcresult" \
              --output-path "$RUNNER_TEMP/simulator-evidence" || true
          fi
          tail -n 215 "$RUNNER_TEMP/native-sim.log"
          exit "$result"
      - name: Upload native simulator evidence
        if: always() && (steps.simulator.outcome == 'success' || steps.simulator.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: SpacetimeGlobe-Native-Simulator
          path: |
            ${{ runner.temp }}/native-sim.log
            ${{ runner.temp }}/simulator-evidence
          retention-days: 14
