name: Verify main site artifacts

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'tools/**'
      - 'build.mjs'
      - 'package.json'
      - 'manifest.webmanifest'
      - '.gitattributes'
      - 'index.html'
      - 'index.offline.html'
      - 'sw.js'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate history content
        run: node tools/verify-content.mjs
      - name: Build online and offline pages
        run: node build.mjs
      - name: Validate generated artifacts
        run: |
          test -s index.html
          test -s index.offline.html
          node --check src/app.js
          node --check src/reading.js
          node --check src/subject-reader.js
          node --check src/event-map.js
          node --check sw.js
          git diff --exit-code -- index.html index.offline.html sw.js docs/CONTENT-COVERAGE.md data/topics.json
