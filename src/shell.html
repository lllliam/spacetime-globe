<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="地球仪">
<meta name="theme-color" content="#0b1017">
<meta name="description" content="一颗地球，一条时间轴：看同一片土地在不同年代属于谁、发生过什么。">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3">
<title>地球仪 · 时空坐标</title>
<style>
/*CSS*/
</style>
</head>
<body>

<canvas id="globe" aria-label="地球"></canvas>
<canvas id="vec" aria-hidden="true"></canvas>

<div id="scrim"></div>

<div id="hud">
  <button id="year" type="button" aria-label="展开时间轴" aria-expanded="false" aria-controls="dock">今天</button>
  <div id="sub"></div>
</div>
<button id="view-toggle" type="button" aria-label="观察方式与显示选项" aria-expanded="false" aria-controls="view-panel"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5-9-5Zm0 4 9 5 9-5M3 16l9 5 9-5"/></svg><span>视图</span></button>
<div id="hint">拖动旋转 · 双指缩放</div>
<div id="view-shade" hidden></div>
<section id="view-panel" hidden role="dialog" aria-label="观察地球">
  <header><h2>观察地球</h2><button id="view-close" type="button" aria-label="关闭视图选项">×</button></header>
  <div id="view-modes" role="group" aria-label="边界与底图"></div>
  <div class="view-switches">
    <button type="button" id="toggle-labels" role="switch" aria-checked="true"><span>地名</span><i></i></button>
    <button type="button" id="toggle-grid" role="switch" aria-checked="false"><span>经纬线</span><i></i></button>
  </div>
  <nav><button id="world-open" type="button">这一年的世界 <span>›</span></button><button id="reset-view" type="button">恢复视角 <span>›</span></button><a id="classic-link" href="classic.html">使用经典界面 <span>↗</span></a></nav>
  <p id="view-note">历史边界为资料重建，未覆盖的地区不代表无人居住。海岸与地形采用现代底图。</p>
</section>
<section id="dock" aria-label="时间控制" inert>
  <header class="time-head"><span id="time-current">今天</span><button id="time-close" type="button" aria-label="收起时间轴">×</button></header>
  <canvas id="track" role="slider" tabindex="0" aria-label="历史年份" aria-valuemin="-3500" aria-valuemax="2026" aria-valuenow="2026"></canvas>
  <div class="time-steps"><button type="button" data-year-step="-10">−10</button><button type="button" data-year-step="-1">−1</button><button id="time-play" type="button" aria-pressed="false">播放</button><button type="button" data-year-step="1">+1</button><button type="button" data-year-step="10">+10</button></div>
  <div class="time-actions"><button id="time-input-toggle" type="button" aria-expanded="false">输入年份</button><label class="time-speed">步长 <select id="time-speed" aria-label="播放步长"><option value="1">1 年</option><option value="10" selected>10 年</option><option value="50">50 年</option></select></label><button id="time-today" type="button">回到今天</button></div>
  <form id="year-form" hidden><label for="year-input">年份（负数为公元前）</label><div><input id="year-input" type="number" inputmode="text" min="-3500" max="2026" step="1" required aria-describedby="year-error"><button type="submit">前往</button></div><p id="year-error" role="status"></p></form>
</section>
  <div id="toolbar"><div id="layers" role="group" aria-label="划分方式"><button type="button" data-layer="country" class="on">国家</button><button type="button" data-layer="polity">政权</button></div><div id="loadpill" hidden role="status"><i></i><span>政权边界 0%</span></div></div>
<div id="sheet-dim" hidden></div>
<div id="sheet" aria-live="polite">
  <div id="grab" role="button" tabindex="0" aria-label="上滑或按回车展开阅读，下滑或按向下键关闭"><i></i><span id="sheet-gesture" aria-hidden="true">上滑阅读 · 下滑关闭</span></div>
  <div id="sheet-scroll"><div id="sheet-inner"></div></div>
</div>

<div id="overlay" hidden>
  <div id="overlay-head">
    <div>
      <h1 id="overlay-title">这一年</h1>
      <p id="overlay-sub"></p>
    </div>
    <button id="overlay-close" type="button" aria-label="关闭">×</button>
  </div>
  <div id="overlay-body"></div>
</div>

<div id="boot">
  <div class="spin"></div>
  <p>正在铺开地图…</p>
</div>

<section id="book" hidden role="dialog" aria-modal="true" aria-labelledby="reading-title">
  <header id="book-bar">
    <button id="reading-back" type="button">← 返回地球</button>
    <span id="book-crumb"></span>
    <button id="reading-map" type="button">在地球上看 ↗</button>
  </header>
  <div id="book-body" tabindex="0"></div>
</section>
<button id="reading-resume" type="button" hidden>返回阅读 ↑</button>

<script id="atlas" type="application/json">/*ATLAS*/</script>
<script id="relief" type="application/octet-stream">/*RELIEF*/</script>
<script id="politypack" type="application/octet-stream">/*POLITY*/</script>
<script id="stories" type="application/json">/*STORIES*/</script>
<script id="topics" type="application/json">/*TOPICS*/</script>
<script>
/*APP*/
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
