<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地球仪">
<meta name="theme-color" content="#0a1016">
<meta name="description" content="一本可以通过地球和时间打开的世界历史书。转动地球，选一个年份，读一段完整的历史。">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="shortcut icon" href="favicon.ico?v=4" type="image/x-icon">
<title>地球仪 · 时空坐标</title>
<style>
/*CSS*/
</style>
</head>
<body>

<canvas id="globe" tabindex="0" aria-label="地球。拖动旋转，捏合或滚轮缩放，点选疆域阅读。按 R 复位视角" aria-haspopup="dialog" aria-controls="view-panel"></canvas>
<canvas id="vec" aria-hidden="true"></canvas>

<div id="scrim"></div>

<div id="hud">
  <div id="year-control">
    <button id="year" type="button" aria-controls="year-form" aria-keyshortcuts="F2" aria-expanded="false">
      <span class="year-label"><span id="year-num">1500</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></span>
      <span id="year-era" role="status">正在加载历史疆域…</span>
    </button>
    <form id="year-form" hidden>
      <div class="year-input-row">
        <input id="year-input" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" spellcheck="false" maxlength="16"
               placeholder="如 1500 或 前221" aria-label="年份，可输入负数或公元前年份" aria-describedby="year-error">
        <button type="submit" aria-label="前往该年份"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <p id="year-error" role="status"></p>
      <div class="year-milestones" aria-label="历史年份快捷入口">
        <button type="button" data-year-jump="-221"><strong>前221</strong><span>秦统一</span></button>
        <button type="button" data-year-jump="476"><strong>476</strong><span>西罗马帝国灭亡</span></button>
        <button type="button" data-year-jump="1206"><strong>1206</strong><span>蒙古帝国建立</span></button>
        <button type="button" data-year-jump="1324"><strong>1324</strong><span>曼萨·穆萨朝觐</span></button>
        <button type="button" data-year-jump="1453"><strong>1453</strong><span>君士坦丁堡陷落</span></button>
        <button type="button" data-year-jump="1500"><strong>1500</strong><span>葡萄牙人抵达巴西</span></button>
      </div>
      <button type="button" id="year-today">返回当代 <span id="year-current"></span></button>
    </form>
  </div>
  <nav id="hud-actions" aria-label="地球视图">
    <button id="hud-view" type="button" aria-label="切换地图图层与视图" aria-controls="view-panel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></button>
  </nav>
</div>

<section id="vernier" aria-label="滑动年份标尺" role="group">
  <div id="vernier-readout" aria-hidden="true">
    <strong id="vernier-year"></strong>
    <span id="vernier-era"></span>
  </div>
  <div id="vernier-track" tabindex="0" role="slider" aria-label="探索年份，左侧更早，右侧更晚" aria-valuemin="-3500" aria-valuenow="1500">
    <div id="vernier-ticks" aria-hidden="true"></div>
    <span class="vernier-needle" aria-hidden="true"></span>
  </div>
  <button id="vernier-events" type="button" aria-controls="overlay">这一年</button>
</section>

<div id="view-shade" hidden></div>
<section id="view-panel" hidden role="dialog" aria-modal="true" aria-label="地球视图">
  <div id="view-modes" role="group" aria-label="地图显示方式">
    <button type="button" data-view="history" aria-pressed="true">随年份</button>
    <button type="button" data-view="modern" aria-pressed="false">现代边界</button>
    <button type="button" data-view="nature" aria-pressed="false">自然地形</button>
  </div>
  <div class="view-switches">
    <button type="button" id="toggle-labels" role="switch" aria-checked="true"><span>地名</span><i aria-hidden="true"></i></button>
    <button type="button" id="toggle-grid" role="switch" aria-checked="false"><span>经纬线</span><i aria-hidden="true"></i></button>
  </div>
  <button type="button" id="reset-view">复位视角</button>
</section>

<div id="sheet-dim" hidden></div>
<div id="sheet">
  <header id="sheet-top">
    <div id="grab" role="button" tabindex="0" aria-label="上下滑动切换抽屉高度，按回车展开阅读"><i></i><span id="sheet-gesture" aria-hidden="true"></span></div>
    <div id="sheet-toolbar">
      <div id="sheet-identity"><span id="sheet-seal" aria-hidden="true">史</span><div class="sheet-identity-copy"><strong id="sheet-identity-name">历史档案</strong><small id="sheet-identity-years">时间与空间</small></div></div>
      <button id="sheet-toc" type="button">目录</button>
      <button id="sheet-close" type="button" aria-label="关闭摘要" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
    </div>
  </header>
  <div id="sheet-scroll"><div id="sheet-inner" aria-live="polite"></div></div>
</div>

<section id="book" role="dialog" aria-modal="true" aria-labelledby="reading-title" hidden>
  <header id="book-bar">
    <button id="reading-back" type="button" hidden aria-label="返回上一级" title="返回上一级">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 6-6 6 6 6M5 12h14"/></svg>
    </button>
    <span id="reading-book-name"></span>
    <nav aria-label="阅读导航">
      <button id="reading-library" type="button" aria-label="历史书目">书目</button>
      <button id="reading-index" type="button" aria-label="章节目录">目录</button>
      <button id="reading-settings" type="button" aria-label="阅读字号" aria-controls="reading-display" aria-expanded="false">Aa</button>
      <button id="reading-exit" type="button">合上</button>
    </nav>
  </header>
  <div id="book-body" tabindex="0" role="region" aria-label="阅读内容"></div>
  <div id="reading-display" role="group" aria-label="阅读字号设置" hidden>
    <strong>阅读字号</strong>
    <div>
      <button type="button" data-reading-size="small">小</button>
      <button type="button" data-reading-size="standard">标准</button>
      <button type="button" data-reading-size="large">大</button>
      <button type="button" data-reading-size="extra">特大</button>
    </div>
  </div>
</section>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" hidden>
  <div id="overlay-head">
    <div>
      <h1 id="overlay-title">这一年</h1>
      <p id="overlay-sub"></p>
    </div>
    <button id="overlay-close" type="button" aria-label="返回地球">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
  </div>
  <div id="overlay-body"></div>
</div>

<div id="boot" role="status">
  <div class="spin"></div>
  <p>正在铺开地图…</p>
</div>

<header id="event-map-top" hidden>
  <button id="event-map-return" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    <span></span>
  </button>
  <div id="event-map-meta"><strong id="event-map-year" aria-label="观察年份"></strong><span id="event-map-type">历史现场</span></div>
</header>
<div id="event-map-points" hidden></div>
<section id="event-map-panel" aria-labelledby="event-map-title" hidden>
  <div class="event-map-head"><h2 id="event-map-title"></h2><button id="event-map-read" type="button" hidden>阅读正文</button></div>
  <div id="event-map-steps" hidden></div>
  <p id="event-map-note" role="status"></p>
  <p id="event-map-distance" hidden></p>
  <div id="event-map-place-chips" role="group" aria-label="场景地点"></div>
  <nav id="event-map-navigation" hidden aria-label="切换历史观察场景">
    <button id="event-map-prev" type="button">← 上一场景</button><span id="event-map-counter"></span><button id="event-map-next" type="button">下一场景 →</button>
  </nav>
  <details id="event-map-participants" hidden>
    <summary><span id="event-participant-names"></span><span class="event-participant-action">参与方</span></summary>
    <dl id="event-participant-roles"></dl>
  </details>
</section>

<div id="footnote-shade" hidden></div>
<aside id="footnote-popover" role="dialog" aria-modal="true" aria-labelledby="footnote-heading" hidden>
  <header><strong id="footnote-heading">史料与注释</strong><button id="footnote-close" type="button" aria-label="关闭注释">×</button></header>
  <p id="footnote-text"></p><a id="footnote-link" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>
</aside>

<script id="atlas" type="application/json">/*ATLAS*/</script>
<script id="clouds" type="application/octet-stream">/*CLOUDS*/</script>
<script id="earth" type="application/octet-stream">/*EARTH*/</script>
<script id="earth-detail" type="application/octet-stream">/*EARTH_DETAIL*/</script>
<script id="terrain" type="application/octet-stream">/*TERRAIN*/</script>
<script id="relief" type="application/octet-stream">/*RELIEF*/</script>
<script id="politypack" type="application/octet-stream">/*POLITY*/</script>
<script id="polity-names" type="application/json">/*POLITY_NAMES*/</script>
<script id="topics" type="application/json">/*TOPICS*/</script>
<script id="subject-books" type="application/json">/*SUBJECT_BOOKS*/</script>
<script id="historical-scenes" type="application/json">/*HISTORICAL_SCENES*/</script>
<script id="timeline-notes" type="application/json">/*TIMELINE_NOTES*/</script>
<script id="world-reading" type="application/json">/*WORLD_READING*/</script>
<script id="history-map-bindings" type="application/json">/*HISTORY_MAP_BINDINGS*/</script>
<script id="history-map-sources" type="application/json">/*HISTORY_MAP_SOURCES*/</script>
<script>
/*APP*/
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
