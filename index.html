<title>地球仪</title>
<style>
:root{
  --bg:#0b1017; --ink:#f4efe3; --muted:#8e99a8; --line:#2a323e;
  --gold:#e0b273; --gold-dim:#8a6a43; --card:#141b24;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",sans-serif;
  overscroll-behavior:none}
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── 顶部信息 ── */
#scrim{position:fixed;left:0;right:0;top:0;height:170px;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 88%,transparent) 6%,transparent)}
#hud{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 10px);z-index:5;pointer-events:none;
  padding:0 20px;display:flex;flex-direction:column;gap:2px}
#year{font:700 44px/1 Georgia,"Songti SC",serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
#sub b{color:var(--gold);font-weight:600}

/* ── 底部：抽屉 + 时间轴 ── */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 0 var(--safe-b);
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 82%,transparent) 26%,var(--bg) 62%)}
#sheet{max-height:0;overflow:hidden;transition:max-height .26s cubic-bezier(.22,.9,.28,1)}
#sheet.open{max-height:34vh}
#sheet-inner{padding:2px 20px 12px;max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet h2{margin:0 0 1px;font:600 17px/1.3 "Songti SC",Georgia,serif}
#sheet .era{margin:0 0 8px;font-size:11.5px;color:var(--gold)}
#sheet .era small{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
#sheet ul{list-style:none;margin:0;padding:0}
#sheet li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid #ffffff0f}
#sheet li i{width:6px;height:6px;border-radius:2px;flex:none;transform:translateY(-1px)}
#sheet li span{flex:1;min-width:0;font-size:13px;line-height:1.35}
#sheet li small{flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#sheet .empty{color:var(--muted);font-size:12.5px;padding:6px 0 10px}
#sheet .note{margin:0 0 6px;font-size:11px;color:var(--muted);letter-spacing:.02em}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 108px);z-index:5;pointer-events:none;
  text-align:center;font-size:11.5px;letter-spacing:.02em;color:var(--muted);opacity:.9;transition:opacity .9s}
#hint.gone{opacity:0}
#hint b{color:var(--gold);font-weight:600}
#handle{display:flex;justify-content:center;padding:6px 0 2px}
#handle i{width:34px;height:4px;border-radius:2px;background:#ffffff26}

#track{display:block;width:100%;height:84px;touch-action:none}
</style>
</head>
<body>
<canvas id="globe" aria-label="地球"></canvas>
<div id="scrim"></div>

<div id="hud"><div id="year">今天</div><div id="sub"></div></div>
<div id="hint"><b>拖动</b>底部时间轴 · <b>双指</b>缩放 · <b>点国家</b>看内容</div>

<div id="dock">
  <div id="sheet"><div id="handle"><i></i></div><div id="sheet-inner"></div></div>
  <canvas id="track" aria-label="时间轴"></canvas>
</div>

<script>
(()=>{
'use strict';
/* ───────── 数据 ───────── */
const ATLAS=JSON.parse(document.getElementById('atlas').textContent);
const {entries,regions,map:geometry}=ATLAS;
const groupById=new Map(regions.map(g=>[g.id,g]));
const byISO=new Map(regions.filter(g=>g.iso).map(g=>[g.iso,g.id]));
const clamp=(n,a,b)=>Math.min(Math.max(n,a),b);
const ord=y=>y<0?y+1:y;
const calendar=y=>y<=0?y-1:y;
const months=[0,31,59,90,120,151,181,212,243,273,304,334];
const time=(y,m,d)=>ord(y)+(m?(months[m-1]+(d||1)-1)/365:0);
for(const e of entries){
  e.first=time(e.start,e.sm,e.sd);
  e.last=e.point?e.first:time(e.end,e.em,e.ed);
}
const KIND={era:['朝代','#6f93b8'],war:['战争','#c0766d'],movement:['思潮','#9a86b8'],
  colonial:['殖民','#c08355'],religion:['宗教','#b79a5f'],economy:['经济','#6aa88c'],
  politics:['政治','#bf7f93'],technology:['科技','#6da3a9'],literature:['文学','#a888b8'],other:['其他','#8a9a7a']};

/* ───────── 时间刻度：分章 + 限幅 ───────── */
const CH=[
  {n:'史前',a:-3500,b:-800,w:.190},
  {n:'古代',a:-800,b:500,w:.213},
  {n:'古典',a:500,b:1000,w:.130},
  {n:'中世纪',a:1000,b:1500,w:.175},
  {n:'大航海',a:1500,b:1800,w:.138},
  {n:'工业',a:1800,b:1900,w:.077},
  {n:'现代',a:1900,b:2026,w:.077}
];
const YMIN=-3500,YMAX=2026;
const cum=[];{let s=0;for(const c of CH){cum.push(s);s+=c.w;}}
function posOfYear(y){
  y=clamp(y,YMIN,YMAX);
  for(let i=0;i<CH.length;i++){
    const c=CH[i];
    if(y<=c.b||i===CH.length-1){
      const t=clamp((y-c.a)/(c.b-c.a),0,1);
      return cum[i]+t*c.w;
    }
  }
  return 1;
}
function yearOfPos(p){
  p=clamp(p,0,1);
  for(let i=0;i<CH.length;i++){
    const c=CH[i];
    if(p<=cum[i]+c.w||i===CH.length-1){
      const t=clamp((p-cum[i])/c.w,0,1);
      return Math.round(c.a+t*(c.b-c.a));
    }
  }
  return YMAX;
}
function chapterOf(y){for(const c of CH)if(y<=c.b)return c;return CH[CH.length-1];}

/* ───────── 状态 ───────── */
const state={year:YMAX,span:30,yaw:-1.35,tilt:.28,zoom:1,panX:0,panY:0,sel:null};

/* ───────── 统计：某年（或窗口）各国条目 ───────── */
const isoOfEntry=new Map(entries.map(e=>[e.id,(groupById.get(e.region)||{}).iso||'']));
function windowOf(y){return y>=YMAX?[YMAX-30,YMAX]:[y,y];}
let countEv=new Map(),countEra=new Map();
function countsAt(y){
  const [a,b]=windowOf(y),oa=ord(a),ob=ord(b);
  const ev=new Map(),era=new Map();
  for(const e of entries){
    if(e.first>ob||e.last<oa)continue;
    const iso=isoOfEntry.get(e.id);
    if(!iso)continue;
    if(e.kind==='era')era.set(iso,(era.get(iso)||0)+1);
    else ev.set(iso,(ev.get(iso)||0)+1);
  }
  return {ev,era};
}
function entriesOfISO(iso,y){
  const [a,b]=windowOf(y),oa=ord(a),ob=ord(b),g=byISO.get(iso);
  return entries.filter(e=>e.region===g&&e.first<=ob&&e.last>=oa)
    .sort((x,z)=>(z.kind==='era')-(x.kind==='era')||z.first-x.first);
}

/* ───────── 材质 ───────── */
const TAU=Math.PI*2;
const W=1024,H=512;          // 材质分辨率
const IDW=2048,IDH=1024;     // 国界 id 图分辨率（命中测试与填色共用）
const PAL={deep:[20,40,64],sea:[38,68,98],shelf:[68,110,134],land:[204,188,159],landDark:[126,110,84],
  rim:[210,204,194],heat:[[150,120,66],[186,146,80],[220,176,92],[246,206,120],[255,232,172]]};
let ID2ISO=[];
let masks=null,relief=null,idTex=null,material=null;

function buildMasks(){
  if(masks)return masks;
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const cl=mk(W,H),cg=mk(W,H),ci=mk(IDW,IDH);
  const lc=cl.getContext('2d',{willReadFrequently:true}),
        gc=cg.getContext('2d',{willReadFrequently:true}),
        ic=ci.getContext('2d',{willReadFrequently:true});
  const sx=W/1000,sy=H/500;
  for(const ctx of [lc,gc]){ctx.setTransform(sx,0,0,sy,0,0);ctx.lineJoin='round';ctx.lineCap='round';}
  ic.setTransform(IDW/1000,0,0,IDH/500,0,0);ic.lineJoin='round';ic.lineCap='round';
  lc.fillStyle='#000';lc.fillRect(0,0,1000,500);
  gc.fillStyle='#000';gc.fillRect(0,0,1000,500);
  ic.fillStyle='#000';ic.fillRect(0,0,1000,500);
  lc.fillStyle='#fff';gc.strokeStyle='#fff';gc.lineWidth=.62;
  geometry.forEach(([iso,path],i)=>{
    const shape=new Path2D(path);
    lc.fill(shape,'evenodd');
    gc.stroke(shape);
    const col=`rgb(${i+1},0,0)`;
    ic.fillStyle=col;ic.strokeStyle=col;ic.lineWidth=.62;
    ic.fill(shape,'evenodd');ic.stroke(shape);
    ID2ISO[i+1]=iso;
  });
  gc.globalAlpha=.4;gc.lineWidth=.43;gc.beginPath();
  for(let lon=-180;lon<180;lon+=30){const x=(lon+180)/.36;gc.moveTo(x,0);gc.lineTo(x,500);}
  for(let lat=-60;lat<=60;lat+=30){const y=(90-lat)/.36;gc.moveTo(0,y);gc.lineTo(1000,y);}
  gc.stroke();
  const A=lc.getImageData(0,0,W,H).data,B=gc.getImageData(0,0,W,H).data,I=ic.getImageData(0,0,IDW,IDH).data;
  const land=new Uint8Array(W*H),lines=new Uint8Array(W*H),id=new Uint8Array(IDW*IDH);
  for(let i=0;i<land.length;i++){land[i]=A[i*4];lines[i]=B[i*4];}
  for(let i=0;i<id.length;i++)id[i]=I[i*4];
  masks={land,lines,id,coast:coastDistance(land)};
  return masks;
}
function coastDistance(land){
  const d=Uint8Array.from(land,v=>v>=128?0:220);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;if(!d[i])continue;let v=d[i];
    if(x>0)v=Math.min(v,d[i-1]+3);
    if(y>0){v=Math.min(v,d[i-W]+3);if(x>0)v=Math.min(v,d[i-W-1]+4);if(x+1<W)v=Math.min(v,d[i-W+1]+4);}
    d[i]=v;
  }
  for(let y=H-1;y>=0;y--)for(let x=W-1;x>=0;x--){
    const i=y*W+x;if(!d[i])continue;let v=d[i];
    if(x+1<W)v=Math.min(v,d[i+1]+3);
    if(y+1<H){v=Math.min(v,d[i+W]+3);if(x>0)v=Math.min(v,d[i+W-1]+4);if(x+1<W)v=Math.min(v,d[i+W+1]+4);}
    d[i]=v;
  }
  return d;
}
function buildMaterial(){
  if(material)return material;
  const m=buildMasks();
  const data=new Uint32Array(W*H);
  const mix=(a,b,k)=>a+(b-a)*k;
  const shelfCurve=d=>Math.exp(-d/16), deepCurve=d=>clamp((d-22)/148,0,1);
  for(let y=0;y<H;y++){
    const row=y*W;
    for(let x=0;x<W;x++){
      const i=row+x,a=m.land[i]/255,ln=m.lines[i]/255,d=m.coast[i];
      const up=y>0?i-W:i,dn=y<H-1?i+W:i,lf=x>0?i-1:i,rt=x<W-1?i+1:i;
      const edge=m.land[i]>150&&(m.land[lf]<96||m.land[rt]<96||m.land[up]<96||m.land[dn]<96)?1:0;
      const seed=Math.imul(i^(i>>>9),0x9e3779b1)>>>0;
      const grain=((seed>>>26)-31.5)*.12;
      const reliefTone=relief?clamp((relief[i]-204)*.5,-58,18):0;
      const shelf=shelfCurve(d),deep=deepCurve(d);
      const soilTone=reliefTone+grain-ln*58;
      let packed=0;
      for(let j=0;j<3;j++){
        let water=mix(PAL.deep[j],PAL.sea[j],1-deep)+grain*.5+ln*26;
        water=mix(water,PAL.shelf[j],shelf*.9);
        const soil=mix(PAL.land[j]+soilTone,PAL.landDark[j],edge*.34);
        packed|=clamp(Math.round(mix(water,soil,a)),0,255)<<(j*8);
      }
      data[i]=packed;
    }
  }
  material=data;
  return data;
}
function loadRelief(){
  const el=document.getElementById('relief');
  if(!el)return;
  const img=new Image();
  img.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=W;c.height=H;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(img,0,0,W,H);
      const px=x.getImageData(0,0,W,H).data;
      relief=new Uint8Array(W*H);
      for(let i=0;i<relief.length;i++)relief[i]=px[i*4];
      material=null;buildMaterial();
    }catch(_){}
  };
  img.src='data:image/jpeg;base64,'+el.textContent.replace(/\s/g,'');
}

/* ───────── 屏幕缓冲 ───────── */
const cv=document.getElementById('globe'),ctx=cv.getContext('2d');
let buf=null,cx=0,cy=0,R=0,dpr=1;
function layout(){
  const w=innerWidth,h=innerHeight;
  dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cx=w/2;cy=h*0.42;
  R=Math.min(w*0.49,h*0.31);
  const D=clamp(Math.round(2*R*dpr),300,640);
  buf=buildScreen(D);
}
function buildScreen(D){
  const c=D/2,rad=D/2-.5,T=.28,cT=Math.cos(T),sT=Math.sin(T);
  const n=D*D,base=new Int32Array(n).fill(-1),idBase=new Int32Array(n).fill(-1),lonW=new Float32Array(n),
    fx=new Uint8Array(n),fy=new Uint8Array(n),sh=new Uint8Array(n),alpha=new Uint8Array(n),rim=new Uint8Array(n);
  let lx=-.62,ly=.60,lz=.51;const ln=Math.hypot(lx,ly,lz);lx/=ln;ly/=ln;lz/=ln;
  for(let py=0;py<D;py++){
    const ny=(py+.5-c)/rad;
    for(let px=0;px<D;px++){
      const nx=(px+.5-c)/rad,rr=nx*nx+ny*ny,i=py*D+px;
      if(rr>=1)continue;
      const nz=Math.sqrt(1-rr),ys=-ny;
      alpha[i]=Math.min(255,Math.round((rad*(1-Math.sqrt(rr))+.35)*255));
      const Yc=ys*cT+nz*sT,Zc=-ys*sT+nz*cT;
      const lat=Math.asin(Yc>1?1:Yc<-1?-1:Yc);
      const v=(.5-lat/Math.PI)*H;
      let row=Math.floor(v);if(row<0)row=0;else if(row>=H)row=H-1;
      base[i]=row*W;
      idBase[i]=row*2*IDW;
      fy[i]=Math.min(255,Math.round((v-row)*255));
      const a0=Math.atan2(nx,Zc);
      let col=((a0/TAU)+.5)*W;if(col>=W)col-=W;
      lonW[i]=Math.floor(col);
      fx[i]=Math.min(255,Math.round((col-Math.floor(col))*255));
      const lam=nx*lx+ys*ly+nz*lz;
      let soft=(lam+.30)/1.24;soft=clamp(soft,0,1);soft=soft*soft*(3-2*soft);
      sh[i]=Math.min(255,Math.round((.47+.60*soft)*(.88+.12*nz)*255));
      const e2=(1-nz)*(1-nz);
      rim[i]=Math.round(e2*e2*(.05+.42*soft)*255);
    }
  }
  const off=document.createElement('canvas');off.width=D;off.height=D;
  const octx=off.getContext('2d');
  const img=octx.createImageData(D,D);
  return {D,base,idBase,lonW,fx,fy,sh,alpha,rim,off,octx,img,u32:new Uint32Array(img.data.buffer)};
}

/* ───────── 颜色缓存 ───────── */
function heatIndex(n){return n<=1?0:n===2?1:n<=4?2:n<=7?3:4;}

/* ───────── 渲染 ───────── */
function refreshCounts(){
  const r=countsAt(state.year);
  countEv=r.ev;countEra=r.era;
}
function draw(){
  const w=innerWidth,h=innerHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createRadialGradient(cx,cy-R*.2,R*.2,cx,cy,Math.max(w,h)*.9);
  g.addColorStop(0,'#1b2431');g.addColorStop(1,'#080c12');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

  const m=material||buildMaterial(),masksRef=masks;
  const {D,base,idBase,lonW,fx,fy,sh,alpha,rim,off,octx,u32}=buf;
  const spin=state.yaw,cs=Math.cos(spin),sn=Math.sin(spin);
  let offset=((spin/TAU)*W)%W;if(offset<0)offset+=W;
  const idTex=masksRef.id,landTex=masksRef.land;
  const z=state.zoom;
  for(let i=0;i<base.length;i++){
    const o=base[i];
    if(o<0){u32[i]=0;continue;}
    let col=lonW[i]-offset;if(col<0)col+=W;
    const x=col|0,x1=x+1===W?0:x+1;
    const t=fx[i]/255,t1=1-t,u=fy[i]/255,u1=1-u;
    const o1=o+W>=m.length?o+W-m.length:o+W;
    const p0=m[o+x],p1=m[o+x1],p2=m[o1+x],p3=m[o1+x1];
    const r0=(((p0&255)*t1+(p1&255)*t)*u1+((p2&255)*t1+(p3&255)*t)*u);
    const g0=((((p0>>>8)&255)*t1+((p1>>>8)&255)*t)*u1+(((p2>>>8)&255)*t1+((p3>>>8)&255)*t)*u);
    const b0=(((p0>>>16)*t1+(p1>>>16)*t)*u1+((p2>>>16)*t1+(p3>>>16)*t)*u);
    const shade=sh[i]/255,dark=1-shade;
    let r=r0*shade+15*dark,g1=g0*shade+16*dark,b1=b0*shade+17*dark;
    const id=idTex[idBase[i]+(x<<1)];
    if(id&&landTex[o+x]>=110){
      const iso=ID2ISO[id]||'';
      const n=countEv.get(iso)||0,cov=countEra.get(iso)||0;
      if(n){
        const hc=PAL.heat[heatIndex(n)],k=.82+Math.min(.12,n*.02);
        r=r*(1-k)+hc[0]*k*shade+15*dark;
        g1=g1*(1-k)+hc[1]*k*shade+16*dark;
        b1=b1*(1-k)+hc[2]*k*shade+17*dark;
      }else if(cov){
        r=r*.93+20*shade;g1=g1*.93+16*shade;b1=b1*.93+10*shade;
      }else{
        r+=(96-r)*.44;g1+=(104-g1)*.44;b1+=(114-b1)*.44;
      }
    }
    r+=rim[i]*.9;g1+=rim[i]*.86;b1+=rim[i]*.72;
    u32[i]=(alpha[i]<<24)|((b1>255?255:b1|0)<<16)|((g1>255?255:g1|0)<<8)|(r>255?255:r|0);
  }
  octx.putImageData(buf.img,0,0);
  ctx.save();
  ctx.translate(cx+state.panX,cy+state.panY);
  const Rz=R*z;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,-Rz,-Rz,Rz*2,Rz*2);
  const glow=ctx.createRadialGradient(0,0,Rz*.9,0,0,Rz*1.34);
  glow.addColorStop(0,'rgba(120,150,190,.16)');glow.addColorStop(.5,'rgba(120,150,190,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,Rz*1.34,0,TAU);ctx.fill();
  ctx.restore();
}

/* ───────── 时间轴 ───────── */
const track=document.getElementById('track'),tctx=track.getContext('2d');
let density=null;
function buildDensity(){
  const N=YMAX-YMIN+1,hist=new Float32Array(N);
  for(const e of entries){
    const a=Math.max(YMIN,Math.ceil(e.first)),b=Math.min(YMAX,Math.floor(e.last));
    for(let y=a;y<=b;y++)hist[y-YMIN]++;
  }
  const sm=new Float32Array(N);
  for(let i=0;i<N;i++){let s=0,c=0;for(let k=-4;k<=4;k++){const j=i+k;if(j>=0&&j<N){s+=hist[j];c++;}}sm[i]=s/c;}
  let mx=0;for(const v of sm)if(v>mx)mx=v;
  density={sm,mx:mx||1};
}
function layoutTrack(){
  const w=track.clientWidth||innerWidth,h=84;
  const d=Math.min(devicePixelRatio||1,3);
  track.width=Math.round(w*d);track.height=Math.round(h*d);
  tctx.setTransform(d,0,0,d,0,0);
  track._w=w;track._h=h;
}
function drawTrack(){
  if(!density)buildDensity();
  const w=track._w,h=track._h,padL=22,padR=22;
  const labelY=13,areaTop=24,areaH=26,railY=64,footY=79;
  tctx.clearRect(0,0,w,h);
  const xOf=p=>padL+p*(w-padL-padR);
  // 密度曲线
  tctx.beginPath();tctx.moveTo(xOf(0),areaTop+areaH);
  const N=YMAX-YMIN+1,steps=160;
  for(let s=0;s<=steps;s++){
    const p=s/steps,y=YMIN+Math.round(p*(YMAX-YMIN));
    const v=Math.log1p(density.sm[clamp(y-YMIN,0,N-1)])/Math.log1p(density.mx);
    tctx.lineTo(xOf(p),areaTop+areaH-v*areaH);
  }
  tctx.lineTo(xOf(1),areaTop+areaH);tctx.closePath();
  tctx.fillStyle='rgba(224,178,115,.14)';tctx.fill();
  tctx.strokeStyle='rgba(224,178,115,.28)';tctx.lineWidth=1;tctx.stroke();
  // 章节分隔
  tctx.strokeStyle='rgba(255,255,255,.10)';tctx.lineWidth=1;
  for(let i=1;i<CH.length;i++){
    const x=xOf(cum[i]);
    tctx.beginPath();tctx.moveTo(x,areaTop-2);tctx.lineTo(x,areaTop+areaH+2);tctx.stroke();
  }
  // 当前章标签
  const ch=chapterOf(state.year);
  const chMid=xOf((posOfYear(ch.a)+posOfYear(ch.b))/2);
  tctx.font='10.5px -apple-system,sans-serif';tctx.textAlign='center';
  tctx.fillStyle='rgba(142,153,168,.9)';tctx.fillText(ch.n,chMid,labelY);
  // 轨道
  tctx.strokeStyle='rgba(255,255,255,.14)';tctx.lineWidth=2;tctx.lineCap='round';
  tctx.beginPath();tctx.moveTo(xOf(0),railY);tctx.lineTo(xOf(1),railY);tctx.stroke();
  const px=xOf(posOfYear(state.year));
  tctx.strokeStyle='rgba(224,178,115,.5)';tctx.lineWidth=2;
  tctx.beginPath();tctx.moveTo(xOf(0),railY);tctx.lineTo(px,railY);tctx.stroke();
  // 端点
  tctx.font='10px -apple-system,sans-serif';
  tctx.textAlign='left';tctx.fillStyle='rgba(142,153,168,.75)';tctx.fillText('前 3500',xOf(0),footY);
  tctx.textAlign='right';tctx.fillStyle='rgba(224,178,115,.95)';tctx.fillText('今天',xOf(1),footY);
  // 拇指
  tctx.fillStyle='#e0b273';
  tctx.beginPath();tctx.arc(px,railY,8,0,TAU);tctx.fill();
  tctx.fillStyle='#0b1017';tctx.beginPath();tctx.arc(px,railY,3,0,TAU);tctx.fill();

}

/* ───────── HUD / 抽屉 ───────── */
const elYear=document.getElementById('year'),elSub=document.getElementById('sub');
const sheet=document.getElementById('sheet'),sheetInner=document.getElementById('sheet-inner');
function syncHud(){
  const y=state.year,ch=chapterOf(y);
  elYear.textContent=y>=YMAX?'今天':(y<0?'前'+(-y)+' 年':y+' 年');
  const ev=countEv,era=countEra;
  let evn=0,eran=0,countries=new Set();
  for(const [iso,v] of ev){evn+=v;countries.add(iso);}
  for(const [iso,v] of era){eran+=v;countries.add(iso);}
  const scope=y>=YMAX?'近 30 年':ch.n;
  elSub.innerHTML=`${scope} · <b>${countries.size}</b> 个国家 · <b>${evn}</b> 条事件`+(eran?` · ${eran} 段纪年`:'');
}
function fmtYear(y){return y<0?'前'+(-y):''+y;}
function dateOf(e){
  return e.point?fmtYear(e.start):`${fmtYear(e.start)}–${fmtYear(e.end)}`;
}
function openSheet(iso){
  const gid=byISO.get(iso),g=groupById.get(gid)||{};
  let list=entriesOfISO(iso,state.year);
  let fallback=false;
  if(!list.length){
    list=entries.filter(e=>e.region===gid).sort((a,b)=>b.first-a.first).slice(0,6);
    fallback=list.length>0;
  }
  const era=list.find(e=>e.kind==='era');
  const rest=list.filter(e=>e!==era).slice(0,9);
  sheetInner.innerHTML=`
    <h2>${g.zh||g.en||iso}</h2>
    ${era?`<p class="era">${era.zh||era.en}<small>${dateOf(era)}</small></p>`:''}
    ${fallback?`<p class="note">所选年份没有记录 · 以下为该国最近的条目</p>`:''}
    ${rest.length?`<ul>${rest.map(e=>`<li><i style="background:${(KIND[e.kind]||KIND.other)[1]}"></i><span>${e.zh||e.en}</span><small>${dateOf(e)}</small></li>`).join('')}</ul>`
      :`<p class="empty">这份年表还没有收录这个国家的条目。</p>`}`;
  sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');state.sel=null;}

/* ───────── 命中测试 ───────── */
function idAtScreen(sx,sy){
  const Rz=R*state.zoom;
  const dx=(sx-cx-state.panX)/Rz,dy=(sy-cy-state.panY)/Rz;
  const rr=dx*dx+dy*dy;
  if(rr>=.999)return 0;
  const nz=Math.sqrt(1-rr),ys=-dy;
  const T=state.tilt,cT=Math.cos(T),sT=Math.sin(T);
  const Yc=ys*cT+nz*sT,Zc=-ys*sT+nz*cT;
  const lat=Math.asin(clamp(Yc,-1,1));
  const a0=Math.atan2(dx,Zc);
  const lon=((a0-state.yaw+Math.PI)%TAU+TAU)%TAU-Math.PI;
  const col=Math.round(((lon/TAU)+.5)*W)%W;
  const row=clamp(Math.round((.5-lat/Math.PI)*H),0,H-1);
  return masks.id[(row*2)*IDW+(col<<1)]||0;
}

/* ───────── 交互 ───────── */
let pointers=new Map(),drag=null,pinch=null,lastTap=0;
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),moved:0});
  if(pointers.size===1){drag={yaw:state.yaw,tilt:state.tilt,px:state.panX,py:state.panY};pinch=null;}
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),zoom:state.zoom,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,px:state.panX,py:state.panY};
    drag=null;
  }
});
cv.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.moved+=Math.abs(dx)+Math.abs(dy);
  p.x=e.clientX;p.y=e.clientY;
  if(pinch&&pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const z=clamp(pinch.zoom*(d/pinch.d),1,2.6);
    state.zoom=z;
    state.panX=clamp(pinch.px+(pinch.cx-cx)*(1-z/pinch.zoom),-R*1.2,R*1.2);
    state.panY=clamp(pinch.py+(pinch.cy-cy)*(1-z/pinch.zoom),-R*1.2,R*1.2);
    return;
  }
  if(drag){
    state.yaw-=dx/(R*state.zoom)*.9;
    state.tilt=clamp(drag.tilt+dy/(R*state.zoom)*.7,-.35,.9);
  }
});
cv.addEventListener('pointerup',e=>{
  const p=pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinch=null;
  if(pointers.size===0)drag=null;
  if(!p)return;
  const dt=performance.now()-p.t;
  if(p.moved<8&&dt<320){
    if(state.zoom>1.02&&state.sel===null){/* 保持 */}    
    const id=idAtScreen(e.clientX,e.clientY);
    if(id){
      const iso=geometry[id-1][0];
      state.sel=iso;openSheet(iso);
    }else{
      closeSheet();
    }
  }
});
cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=null;drag=null;});

let dragging=false;
function posFromEvent(e){
  const r=track.getBoundingClientRect();
  const padL=20,padR=20,w=r.width;
  return clamp((e.clientX-r.left-padL)/(w-padL-padR),0,1);
}
track.addEventListener('pointerdown',e=>{
  dragging=true;try{track.setPointerCapture(e.pointerId);}catch(_){}
  state.year=yearOfPos(posFromEvent(e));state.span=state.year>=YMAX?30:0;
  refreshCounts();syncHud();drawTrack();draw();
});
track.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const y=yearOfPos(posFromEvent(e));
  if(y!==state.year){
    state.year=y;state.span=y>=YMAX?30:0;
    refreshCounts();syncHud();drawTrack();draw();
  }
});
track.addEventListener('pointerup',e=>{dragging=false;});
track.addEventListener('pointercancel',()=>{dragging=false;});

addEventListener('resize',()=>{layout();layoutTrack();drawTrack();draw();});

/* ───────── 启动 ───────── */
buildMasks();
layout();
layoutTrack();
refreshCounts();
syncHud();
drawTrack();
draw();
loadRelief();
// 缓慢自转，拖动时暂停
let last=performance.now(),auto=true;
cv.addEventListener('pointerdown',()=>{auto=false;});
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(auto&&pointers.size===0)state.yaw-=.035*dt;
  if(auto||pointers.size)draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// 引导提示：4.5 秒或首次操作后淡出
const hint=document.getElementById('hint');
const hideHint=()=>hint.classList.add('gone');
setTimeout(hideHint,4500);
cv.addEventListener('pointerdown',hideHint,{once:true});
track.addEventListener('pointerdown',hideHint,{once:true});
})();
</script>
