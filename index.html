<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="地球仪">
<meta name="theme-color" content="#0b1017">
<meta name="description" content="一颗地球，一条时间轴：看同一片土地在不同年代属于谁、发生过什么。">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<title>地球仪 · 时空坐标</title>
<style>
:root{
  --bg:#0b1017; --ink:#f4efe3; --muted:#8e99a8; --line:#2a323e;
  --gold:#e0b273; --gold-dim:#8a6a43; --card:#141b24;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 70% at 50% 34%,#16202c 0%,#0b1017 55%,#070a0f 100%)}

#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* ── 顶部 ── */
#scrim{position:fixed;left:0;right:0;top:0;height:190px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,16,23,.94) 4%,rgba(11,16,23,.55) 46%,rgba(11,16,23,0) 100%)}
#hud{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 8px);z-index:5;
  padding:0 20px;display:flex;flex-direction:column;gap:1px;align-items:flex-start}
#year{display:block;margin:0;padding:0;border:0;background:none;color:var(--ink);
  font:700 42px/1.05 Georgia,"Songti SC","Noto Serif SC",serif;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;text-align:left;cursor:pointer}
#year::after{content:"›";font:400 22px/1 -apple-system,sans-serif;color:var(--gold-dim);
  margin-left:8px;vertical-align:6px;letter-spacing:0}
#year:active{opacity:.72}
#sub{font-size:11.5px;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}
#sub b{color:var(--gold);font-weight:600}

/* ── 引导 ── */
#hint{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 116px);z-index:5;pointer-events:none;
  text-align:center;font-size:11.5px;letter-spacing:.02em;color:var(--muted);opacity:.95;
  transition:opacity .8s ease,transform .8s ease}
#hint b{color:var(--gold);font-weight:600}
#hint.gone{opacity:0;transform:translateY(6px)}

/* ── 底部：抽屉 + 时间轴 ── */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 0 var(--safe-b);
  background:linear-gradient(180deg,rgba(11,16,23,0) 0%,rgba(11,16,23,.86) 22%,rgba(11,16,23,.98) 46%,#0b1017 100%)}
#sheet{max-height:0;overflow:hidden;transition:max-height .28s cubic-bezier(.22,.9,.28,1);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  background:linear-gradient(180deg,rgba(11,16,23,.70) 0%,rgba(11,16,23,.955) 26%,rgba(11,16,23,.99) 100%)}
#sheet.open{max-height:42vh}
#sheet-inner{padding:0 20px 10px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
#handle{display:flex;justify-content:center;padding:8px 0 4px}
#handle i{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
#sheet h2{margin:0;font:600 17px/1.35 "Songti SC","Noto Serif SC",Georgia,serif;display:flex;align-items:baseline;gap:8px}
#sheet h2 em{font:400 11px/1 -apple-system,sans-serif;font-style:normal;color:var(--muted);letter-spacing:.02em}
#sheet .era{margin:2px 0 9px;font-size:12px;color:var(--gold)}
#sheet .era small{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;font-size:11px}
#sheet ul{list-style:none;margin:0;padding:0}
#sheet li{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
#sheet li i{width:6px;height:6px;border-radius:2px;flex:none;transform:translateY(-2px)}
#sheet li span{flex:1;min-width:0;font-size:13px;line-height:1.4}
#sheet li small{flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#sheet .empty{color:var(--muted);font-size:12.5px;padding:8px 0 12px}
#sheet .note{margin:0 0 6px;font-size:11px;color:var(--muted);letter-spacing:.02em}
#sheet .foot{margin:9px 0 2px;font-size:10.5px;color:#6c7686;letter-spacing:.02em}
#sheet .walk{cursor:pointer}
#sheet .walk:active{opacity:.6}

#track{display:block;width:100%;height:96px;touch-action:none}

/* ── 全景列表 ── */
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(9,13,19,.97),rgba(9,13,19,.99));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:calc(var(--safe-t) + 10px) 0 0;
  animation:slideUp .3s cubic-bezier(.22,.9,.28,1)}
#overlay[hidden]{display:none}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#overlay-head{display:flex;align-items:flex-start;gap:12px;padding:4px 20px 10px;flex:none;
  border-bottom:1px solid rgba(255,255,255,.07)}
#overlay-head h1{margin:0;font:700 30px/1.1 Georgia,"Songti SC",serif;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
#overlay-head p{margin:3px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.03em}
#overlay-head p b{color:var(--gold);font-weight:600}
#overlay-close{margin-left:auto;flex:none;width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.04);color:var(--ink);font:300 20px/1 -apple-system,sans-serif;cursor:pointer}
#overlay-close:active{background:rgba(255,255,255,.12)}
#overlay-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:6px 20px calc(var(--safe-b) + 24px)}
.wgroup{margin:14px 0 2px;font-size:11px;letter-spacing:.08em;color:var(--gold-dim);text-transform:uppercase}
.wrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);cursor:pointer}
.wrow:active{opacity:.6}
.wrow i{width:6px;height:6px;border-radius:2px;flex:none;transform:translateY(-2px)}
.wrow .t{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.wrow .m{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.wrow .y{flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wrow a{color:var(--gold-dim);text-decoration:none;font-size:11px}
.wempty{color:var(--muted);font-size:13px;padding:26px 0}

/* ── 启动 ── */
#boot{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em}
#boot .spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(224,178,115,.22);
  border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:720px){
  #hud{padding:0 28px}
  #sheet-inner{padding:0 28px 10px}
  #overlay-head{padding:4px 28px 10px}
  #overlay-body{padding:6px 28px 40px}
  #year{font-size:52px}
  #hint{bottom:calc(var(--safe-b) + 128px)}
}

/* ── 图层开关 + 加载指示 ── */
#toolbar{display:flex;align-items:center;gap:10px;padding:0 18px 2px}
#layers{margin-left:auto;display:flex;gap:0;border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:2px;background:rgba(255,255,255,.03)}
#layers button{appearance:none;border:0;background:none;color:var(--muted);
  font:500 11.5px/1 -apple-system,system-ui,sans-serif;letter-spacing:.02em;
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:color .18s,background .18s}
#layers button.on{background:rgba(224,178,115,.14);color:var(--gold)}
#layers button:active{opacity:.7}
#loadpill{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);
  letter-spacing:.02em;font-variant-numeric:tabular-nums}
#loadpill[hidden]{display:none}
#loadpill i{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(224,178,115,.25);
  border-top-color:var(--gold);animation:sp .8s linear infinite;display:block}

@media (min-width:720px){ #toolbar{padding:0 28px 2px} }

/* ── 实体档案的事实行 ── */
#sheet .facts{list-style:none;margin:0 0 10px;padding:0}
#sheet .facts li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border:0;font-size:12px}
#sheet .facts .dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--gold-dim);transform:translateY(-1px)}
#sheet .facts span{flex:1;min-width:0;color:#cfc6b4;line-height:1.4}
#sheet .facts small{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
#sheet .era2{margin:2px 0 4px;font-size:12px;color:var(--gold)}
#sheet .era2 small{color:var(--muted);margin-left:6px;font-size:11px;font-variant-numeric:tabular-nums}

/* ── 阅读视图（一本书） ── */
#book{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0d131b 0%,#0a0f16 60%,#080c12 100%);
  animation:bookIn .28s cubic-bezier(.22,.9,.28,1)}
#book[hidden]{display:none}
@keyframes bookIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#book-bar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 8px) 14px 8px;
  border-bottom:1px solid rgba(255,255,255,.06)}
#book-close{width:32px;height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.04);color:var(--ink);font:300 20px/1 -apple-system,sans-serif;cursor:pointer;flex:none}
#book-close:active{background:rgba(255,255,255,.12)}
#book-crumb{font-size:11px;letter-spacing:.06em;color:var(--muted)}
#book-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:22px 22px calc(var(--safe-b) + 60px)}
#book-body .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold-dim);text-transform:uppercase}
#book-body h1{margin:6px 0 2px;font:700 34px/1.15 Georgia,"Songti SC","Noto Serif SC",serif;letter-spacing:-.01em}
#book-body .when{margin:0 0 18px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#book-body .when b{color:var(--gold);font-weight:600}
#book-body .lede{font:400 15px/1.85 Georgia,"Songti SC",serif;color:#e6dfd0;margin:0 0 22px;
  padding-left:14px;border-left:2px solid rgba(224,178,115,.35)}
#book-body h2{margin:30px 0 4px;font:600 15px/1.4 -apple-system,"PingFang SC",sans-serif;
  letter-spacing:.04em;color:var(--gold);display:flex;align-items:baseline;gap:10px}
#book-body h2 em{font:400 11px/1 -apple-system,sans-serif;font-style:normal;color:var(--muted);letter-spacing:.02em}
#book-body h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(224,178,115,.28),transparent)}
#book-body article{margin:0 0 18px}
#book-body article h3{margin:12px 0 2px;font:600 16px/1.45 "Songti SC",Georgia,serif;color:var(--ink)}
#book-body article .meta{margin:0 0 8px;font-size:11px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
#book-body article .meta i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;transform:translateY(-1px)}
#book-body article p{margin:0 0 10px;font-size:14.5px;line-height:1.85;color:#cfc6b4}
#book-body article .src{font-size:11px;color:var(--gold-dim);text-decoration:none}
#book-body article .noprose{color:#8b93a1;font-size:13.5px;font-style:italic}
#book-body .more{margin:26px 0 0;display:flex;flex-wrap:wrap;gap:10px}
#book-body .more button{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
  color:var(--ink);font:500 12.5px/1 -apple-system,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
#book-body .more button:active{background:rgba(255,255,255,.12)}
#book-body .credits{margin:30px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);
  font-size:10.5px;line-height:1.7;color:#6f7a8a}
#book-body .credits b{color:#8b96a6;font-weight:600}

@media (min-width:720px){ #book-body{padding:30px 28px 80px;max-width:760px;margin:0 auto}
  #book-body h1{font-size:44px} #book-body .lede{font-size:16px} }
#book-body h2.here{color:#f0c98a}
#book-body h2.here::after{background:linear-gradient(90deg,rgba(224,178,115,.8),transparent)}
#book-body h2.here::before{content:"此刻";font:600 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;
  color:#0b1017;background:var(--gold);padding:3px 5px;border-radius:4px;order:-1;transform:translateY(-1px)}

</style>
</head>
<body>

<canvas id="globe" aria-label="地球"></canvas>

<div id="scrim"></div>

<div id="hud">
  <button id="year" type="button" aria-label="看这一年的世界">今天</button>
  <div id="sub"></div>
</div>

<div id="hint"><b>拖动</b>转地球 · <b>双指</b>缩放 · <b>点陆块</b>看它是谁 · <b>点年份</b>看世界</div>

<div id="dock">
  <div id="sheet" aria-live="polite">
    <div id="handle"><i></i></div>
    <div id="sheet-inner"></div>
  </div>
  <div id="toolbar">
    <div id="layers" role="group" aria-label="划分方式">
      <button type="button" data-layer="country" class="on">国家</button>
      <button type="button" data-layer="polity">政权</button>
    </div>
    <div id="loadpill" hidden><i></i><span>政权边界 0%</span></div>
  </div>
  <canvas id="track" aria-label="时间轴"></canvas>
</div>

<div id="overlay" hidden>
  <div id="overlay-head">
    <div>
      <h1 id="overlay-title">这一年</h1>
      <p id="overlay-sub"></p>
    </div>
    <button id="overlay-close" type="button" aria-label="关闭">×</button>
  </div>
  <div id="overlay-body"></div>
</div>

<div id="book" hidden>
  <div id="book-bar">
    <button id="book-close" type="button" aria-label="关闭">‹</button>
    <span id="book-crumb"></span>
  </div>
  <div id="book-body"></div>
</div>

<div id="boot">
  <div class="spin"></div>
  <p>正在铺开地图…</p>
</div>

<script id="atlas" type="application/json"></script>
<script id="relief" type="application/octet-stream"></script>
<script id="politypack" type="application/octet-stream"></script>
<script id="stories" type="application/json"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   地球仪 · 时空坐标 · v2
   架构：球是空间索引，时间轴是时间索引，两者交叉出「此刻此地」的切片；
        切片里挂着实体（国家 / 政权），实体之间用关系连成图。
        所有界面都是这张图的投影，共享同一个会话状态 {year, layer, focus}。
   ═══════════════════════════════════════════════════════════════ */
(() => {
'use strict';

/* ───────────── 0. 基础 ───────────── */
const TAU = Math.PI * 2;
const clamp = (n, a, b) => (n < a ? a : n > b ? b : n);
const lerp = (a, b, t) => a + (b - a) * t;

const THIS_YEAR = new Date().getFullYear();
const YMAX = Math.max(2026, THIS_YEAR);
const YMIN = -3500;
const POLITY_END = 2024;                 // Cliopatria 覆盖到此

const CH = [
  { n: '史前',   a: -3500, b: -800, w: .190 },
  { n: '古代',   a: -800,  b: 500,  w: .213 },
  { n: '古典',   a: 500,   b: 1000, w: .130 },
  { n: '中世纪', a: 1000,  b: 1500, w: .175 },
  { n: '大航海', a: 1500,  b: 1800, w: .138 },
  { n: '工业',   a: 1800,  b: 1900, w: .077 },
  { n: '现代',   a: 1900,  b: YMAX, w: .077 },
];
const cum = (() => { const o = []; let s = 0; for (const c of CH) { o.push(s); s += c.w; } return o; })();

function posOfYear(y) {
  y = clamp(y, YMIN, YMAX);
  for (let i = 0; i < CH.length; i++) {
    const c = CH[i];
    if (y <= c.b || i === CH.length - 1) return cum[i] + clamp((y - c.a) / (c.b - c.a), 0, 1) * c.w;
  }
  return 1;
}
function yearOfPos(p) {
  p = clamp(p, 0, 1);
  for (let i = 0; i < CH.length; i++) {
    const c = CH[i];
    if (p <= cum[i] + c.w || i === CH.length - 1) return Math.round(c.a + clamp((p - cum[i]) / c.w, 0, 1) * (c.b - c.a));
  }
  return YMAX;
}
const chapterOf = (y) => { for (const c of CH) if (y <= c.b) return c; return CH[CH.length - 1]; };

const ord = (y) => (y < 0 ? y + 1 : y);
const MONTHS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
const tOf = (y, m, d) => ord(y) + (m ? (MONTHS[m - 1] + (d || 1) - 1) / 365.25 : 0);
const fmtYear = (y) => (y < 0 ? '前' + (-y) : String(y));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const TODAY_SPAN = 30;
function windowOf(y) {
  if (y >= YMAX) return [YMAX - TODAY_SPAN, YMAX, '近 ' + TODAY_SPAN + ' 年'];
  return [y, y, chapterOf(y).n];
}

/* ───────────── 1. 素材装载 ───────────── */
const TW = 2048, TH = 1024;            // 贴图 / id 图分辨率
const PW = 1024, PH = 512;             // 拾取栅格
const MAPW = 1000, MAPH = 500;
const Q = 4;                           // 政权几何的量化倍数

const el = (id) => document.getElementById(id);
const canvas = el('globe');
const track = el('track'), tctx = track.getContext('2d');
const elYear = el('year'), elSub = el('sub');
const sheetEl = el('sheet'), sheetInner = el('sheet-inner');
const hintEl = el('hint'), overlay = el('overlay');
const overlayTitle = el('overlay-title'), overlaySub = el('overlay-sub'), overlayBody = el('overlay-body');
const bootEl = el('boot'), layersEl = el('layers'), loadPill = el('loadpill');

const inlineText = (id) => { const n = el(id); return n ? n.textContent.trim() : ''; };

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function gunzip(buf) {
  if (typeof DecompressionStream === 'undefined') return null;
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).arrayBuffer();
}
async function fetchWithProgress(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' → HTTP ' + res.status);
  const total = Number(res.headers.get('content-length') || 0);
  if (!res.body || !total) return res.arrayBuffer();
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    onProgress && onProgress(got / total);
  }
  const out = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out.buffer;
}

/* 世界数据：地区 + 年表 + 现代国界 */
async function loadWorld() {
  const inline = inlineText('atlas');
  if (inline.length > 100) return JSON.parse(inline);
  const res = await fetch('data/world.json');
  if (!res.ok) throw new Error('data/world.json 读取失败');
  return res.json();
}

/* 政权包：自解释二进制 SGP1 */
function parsePolityBin(buf) {
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (magic !== 'SGP1') throw new Error('政权包格式不对: ' + magic);
  const nEnt = dv.getUint32(4, true), nSlice = dv.getUint32(8, true), nPath = dv.getUint32(12, true);
  const entOff = dv.getUint32(16, true), sliceOff = dv.getUint32(20, true);
  const pathIdxOff = dv.getUint32(24, true);
  const dec = new TextDecoder();
  const entities = new Array(nEnt);
  let o = entOff;
  for (let i = 0; i < nEnt; i++) {
    const len = dv.getUint16(o, true); o += 2;
    const name = dec.decode(new Uint8Array(buf, o, len)); o += len;
    const from = dv.getInt16(o, true); o += 2;
    const to = dv.getInt16(o, true); o += 2;
    entities[i] = { id: i, name, from, to };
  }
  const slices = new Int32Array(nSlice * 4);
  o = sliceOff;
  for (let i = 0; i < nSlice; i++) {
    slices[i * 4] = dv.getUint16(o, true);
    slices[i * 4 + 1] = dv.getInt16(o + 2, true);
    slices[i * 4 + 2] = dv.getInt16(o + 4, true);
    slices[i * 4 + 3] = dv.getUint16(o + 6, true);
    o += 8;
  }
  const pathIdx = new Uint32Array(nPath + 1);
  for (let i = 0; i <= nPath; i++) pathIdx[i] = dv.getUint32(pathIdxOff + i * 4, true);
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  return { bytes, dv, entities, slices, nSlice, pathIdx, nPath, cache: new Map() };
}

/* 解码一条路径 → Path2D + bbox（带 LRU 缓存，一帧只要几十条） */
function polityShape(pk, pathId) {
  let hit = pk.cache.get(pathId);
  if (hit) { pk.cache.delete(pathId); pk.cache.set(pathId, hit); return hit; }
  const bytes = pk.bytes, dv = pk.dv;
  let o = pk.pathIdx[pathId];
  const subCount = dv.getUint16(o, true); o += 2;
  const p = new Path2D();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let s = 0; s < subCount; s++) {
    const n = dv.getUint16(o, true); o += 2;
    let x = dv.getUint16(o, true); o += 2;
    let y = dv.getUint16(o, true); o += 2;
    p.moveTo(x / Q, y / Q);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
    for (let k = 1; k < n; k++) {
      let v = 0, sh = 0, b;
      do { b = bytes[o++]; v |= (b & 127) << sh; sh += 7; } while (b & 128);
      x += v & 1 ? ~(v >> 1) : (v >> 1);
      v = 0; sh = 0;
      do { b = bytes[o++]; v |= (b & 127) << sh; sh += 7; } while (b & 128);
      y += v & 1 ? ~(v >> 1) : (v >> 1);
      p.lineTo(x / Q, y / Q);
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    p.closePath();
  }
  const shape = { path: p, area: ((x1 - x0) / Q) * ((y1 - y0) / Q) };
  if (pk.cache.size > 900) pk.cache.delete(pk.cache.keys().next().value);
  pk.cache.set(pathId, shape);
  return shape;
}

/* ───────────── 2. 世界索引 ───────────── */
let world = null, regions = [], regionById = new Map(), regionByIso = new Map(), entries = [], mapShapes = [];
let entryByRegion = new Map();
let pk = null;                          // 政权包
let polityState = { loading: false, loaded: false, error: null };

function initWorld(w) {
  world = w;
  regions = w.regions;
  regionById = new Map(regions.map((r) => [r.id, r]));
  regionByIso = new Map(regions.filter((r) => r.iso).map((r) => [r.iso, r]));
  entries = w.entries.map((e) => {
    const t0 = tOf(e.start, e.sm, e.sd);
    let t1 = e.point ? t0 : tOf(e.end, e.em, e.ed);
    if (!(t1 >= t0)) t1 = t0;
    return { ...e, t0, t1 };
  });
  entryByRegion = new Map();
  for (const e of entries) {
    let a = entryByRegion.get(e.region);
    if (!a) entryByRegion.set(e.region, (a = []));
    a.push(e);
  }
  mapShapes = w.map.map(([iso, path], i) => ({ id: i + 1, iso, path, area: 0 }));
  for (const s of mapShapes) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const m of s.path.matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)) {
      const x = +m[1], y = +m[2];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    s.area = (x1 - x0) * (y1 - y0);
    s.p2d = new Path2D(s.path);
  }
}

/* ───────────── 3. 图层 ───────────── */
/* 图层 = f(年) → 一组 {id, 形状, 实体}。渲染、拾取、着色、关系全部只认这一层。 */
const LAYERS = {
  country: {
    id: 'country', name: '国家', range: [YMIN, YMAX],
    currentYear: (y) => y,
    shapes(year) {
      return mapShapes.map((s) => ({ id: s.id, path: s.p2d, area: s.area, iso: s.iso }));
    },
    entityOfShape(s) {
      const r = regionByIso.get(s.iso);
      return r ? { kind: 'country', region: r } : null;
    },
  },
  polity: {
    id: 'polity', name: '政权', range: [-3400, POLITY_END],
    currentYear: (y) => clamp(y, -3400, POLITY_END),
    shapes(year) {
      if (!pk) return [];
      const y = clamp(year, -3400, POLITY_END);
      const out = [];
      for (let i = 0; i < pk.nSlice; i++) {
        if (pk.slices[i * 4 + 1] > y || pk.slices[i * 4 + 2] < y) continue;
        out.push({ id: out.length + 1, ent: pk.entities[pk.slices[i * 4]], pathId: pk.slices[i * 4 + 3] });
      }
      /* 小的画在上层：点在帝国里点到小王国的概率更高，也符合“实际统治层级” */
      out.sort((a, b) => polityShape(pk, b.pathId).area - polityShape(pk, a.pathId).area);
      out.forEach((s, i) => { s.id = i + 1; });
      return out;
    },
    entityOfShape(s) { return { kind: 'polity', ent: s.ent }; },
  },
};

const state = {
  year: YMAX,
  layerId: 'country',
  yaw: -1.42,
  tilt: 0.30,
  zoom: 1,
  panX: 0,
  panY: 0,
  focus: null,          // {layerId, id}
  stale: false,         // 政权层沿用上一年（超出数据范围）
};

const view = { w: 1, h: 1, cx: 0, cy: 0, R: 1, dpr: 1, Rz: 1 };

/* ───────────── 4. 分区（栅格化 + 拾取 + 着色表） ───────────── */
const idCanvas = document.createElement('canvas');
idCanvas.width = TW; idCanvas.height = TH;
const idCtx = idCanvas.getContext('2d', { willReadFrequently: true });
const pickCanvas = document.createElement('canvas');
pickCanvas.width = PW; pickCanvas.height = PH;
const pickCtx = pickCanvas.getContext('2d', { willReadFrequently: true });

let partition = { layerId: 'country', year: YMAX, shapes: [], pick: new Uint8Array(PW * PH), counts: new Map(), lut: new Uint8Array(256 * 4) };
let summary = { ev: 0, era: 0, countries: 0, entities: 0 };

/* 金色 = 这一年这里的记录多；越深越暖，但不要亮成白色（那会读成“高亮”） */
const HEAT = [[142, 112, 60], [168, 132, 70], [196, 152, 80], [220, 172, 92], [238, 192, 108]];
const heatIndex = (n) => (n <= 1 ? 0 : n === 2 ? 1 : n <= 4 ? 2 : n <= 7 ? 3 : 4);

function rasterize(layer, year) {
  const shapes = layer.shapes(year);
  idCtx.setTransform(1, 0, 0, 1, 0, 0);
  idCtx.globalCompositeOperation = 'source-over';
  idCtx.fillStyle = '#000';
  idCtx.fillRect(0, 0, TW, TH);
  idCtx.setTransform(TW / MAPW, 0, 0, TH / MAPH, 0, 0);
  idCtx.lineJoin = 'round';
  for (const s of shapes) {
    const p = layer.id === 'polity' ? polityShape(pk, s.pathId).path : s.path;
    idCtx.fillStyle = 'rgb(' + s.id + ',255,0)';
    idCtx.fill(p, 'evenodd');
  }
  /* 边界只写进 B 通道（lighter 叠加不破坏 R/G 的 id 编码） */
  idCtx.globalCompositeOperation = 'lighter';
  idCtx.strokeStyle = 'rgb(0,0,255)';
  idCtx.lineWidth = 0.95;
  for (const s of shapes) {
    const p = layer.id === 'polity' ? polityShape(pk, s.pathId).path : s.path;
    idCtx.stroke(p);
  }
  idCtx.globalCompositeOperation = 'source-over';

  /* 拾取栅格 */
  pickCtx.setTransform(1, 0, 0, 1, 0, 0);
  pickCtx.imageSmoothingEnabled = false;
  pickCtx.clearRect(0, 0, PW, PH);
  pickCtx.drawImage(idCanvas, 0, 0, PW, PH);
  const px = pickCtx.getImageData(0, 0, PW, PH).data;
  const pick = new Uint8Array(PW * PH);
  for (let i = 0, p = 0; i < pick.length; i++, p += 4) {
    const cover = px[p + 1];
    if (cover > 100) pick[i] = Math.round((px[p] * 255) / cover);
  }
  despeckle(pick);
  return { shapes, pick };
}

/* 边界上两个 id 混色会算出第三个 id（既点错也连出假邻居），这里把 1px 的杂点擦掉 */
function despeckle(pick) {
  const out = pick;
  const cand = [0, 0, 0, 0];
  for (let y = 1; y < PH - 1; y++) {
    const row = y * PW;
    for (let x = 1; x < PW - 1; x++) {
      const i = row + x, v = pick[i];
      cand[0] = pick[i - 1]; cand[1] = pick[i + 1];
      cand[2] = pick[i - PW]; cand[3] = pick[i + PW];
      if (cand[0] === v || cand[1] === v || cand[2] === v || cand[3] === v) continue;
      let best = 0, bestN = 0;
      for (let k = 0; k < 4; k++) {
        const c = cand[k];
        if (!c) continue;
        let cnt = 0;
        for (let j = 0; j < 4; j++) if (cand[j] === c) cnt++;
        if (cnt > bestN) { bestN = cnt; best = c; }
      }
      if (bestN >= 3) out[i] = best;
    }
  }
}

/* 条目代表点落在哪个 id 上 → 每个 id 的“记录数” */
function countEntries(pick) {
  const counts = new Map();
  for (const e of entries) {
    if (e.px === undefined) continue;
    if (e.t1 < ord(state.year) - 400 || e.t0 > ord(state.year)) continue; // 粗过滤，正式判定在档案页
    const x = Math.min(PW - 1, Math.max(0, (e.px / MAPW * PW) | 0));
    const y = Math.min(PH - 1, Math.max(0, (e.py / MAPH * PH) | 0));
    const id = pick[y * PW + x];
    if (id) counts.set(id, (counts.get(id) || 0) + 1);
  }
  return counts;
}

function buildLut(layer, shapes, counts) {
  const lut = new Uint8Array(256 * 4);
  for (const s of shapes) {
    const n = counts.get(s.id) || 0;
    const o = s.id * 4;
    if (n) {
      const h = HEAT[heatIndex(n)];
      lut[o] = h[0]; lut[o + 1] = h[1]; lut[o + 2] = h[2];
      lut[o + 3] = Math.round(255 * (0.84 + Math.min(0.12, n * 0.02)));
    } else if (layer.id === 'polity') {
      /* 政权层：无记录也要能分辨相邻政权，否则整张图糊成一片 */
      const v = 104 + ((s.id * 53) % 34);
      lut[o] = v; lut[o + 1] = v + 5; lut[o + 2] = v + 12;
      lut[o + 3] = 118;
    } else {
      lut[o] = 118; lut[o + 1] = 127; lut[o + 2] = 140; lut[o + 3] = 116;
    }
  }
  return lut;
}

function rebuildPartition() {
  const layer = LAYERS[state.layerId];
  const year = layer.currentYear(state.year);
  state.stale = year !== state.year;
  const t0 = performance.now();
  const { shapes, pick } = rasterize(layer, year);
  const counts = countEntries(pick);
  const lut = buildLut(layer, shapes, counts);
  partition = { layerId: layer.id, year, shapes, pick, counts, lut };
  if (glr) { glr.uploadId(idCanvas); glr.uploadLut(lut); }
  updateSummary();
  if (state.focus && state.focus.layerId !== layer.id) state.focus = null;
  return performance.now() - t0;
}

function updateSummary() {
  let ev = 0;
  const set = new Set();
  const [a, b] = windowOf(state.year), oa = ord(a), ob = ord(b);
  for (const e of entries) {
    if (e.t1 < oa || e.t0 > ob) continue;
    if (e.kind === 'era') ev += 0; else ev++;
    set.add(e.region);
  }
  summary = { ev, era: 0, countries: set.size, entities: partition.shapes.length };
}

/* ───────────── 5. 材质 ───────────── */
let baseCanvas = null, reliefImg = null;
let glr = null;

function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function buildBaseCanvas() {
  const c = newCanvas(TW, TH);
  const g = c.getContext('2d');
  const sea = g.createLinearGradient(0, 0, 0, TH);
  sea.addColorStop(0.00, '#08161f');
  sea.addColorStop(0.22, '#123047');
  sea.addColorStop(0.50, '#1d4963');
  sea.addColorStop(0.78, '#123047');
  sea.addColorStop(1.00, '#08161f');
  g.fillStyle = sea; g.fillRect(0, 0, TW, TH);

  const paths = mapShapes.map((s) => s.p2d);
  g.setTransform(TW / MAPW, 0, 0, TH / MAPH, 0, 0);
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(104,158,178,.34)'; g.lineWidth = 5;
  for (const p of paths) g.stroke(p);
  g.strokeStyle = 'rgba(150,200,214,.30)'; g.lineWidth = 1.8;
  for (const p of paths) g.stroke(p);

  const landAll = new Path2D();
  for (const p of paths) landAll.addPath(p);
  g.fillStyle = '#c9bd9f';
  for (const p of paths) g.fill(p, 'evenodd');

  if (reliefImg) {
    g.save();
    g.clip(landAll, 'evenodd');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'multiply';
    g.globalAlpha = 0.62;
    g.drawImage(reliefImg, 0, 0, TW, TH);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 0.20;
    g.drawImage(reliefImg, 0, 0, TW, TH);
    g.restore();
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.strokeStyle = 'rgba(255,255,255,.055)'; g.lineWidth = 1;
  g.beginPath();
  for (let lon = -180; lon <= 180; lon += 30) { const x = ((lon + 180) / 360) * TW; g.moveTo(x, 0); g.lineTo(x, TH); }
  for (let lat = -60; lat <= 60; lat += 30) { const y = ((90 - lat) / 180) * TH; g.moveTo(0, y); g.lineTo(TW, y); }
  g.stroke();

  g.setTransform(TW / MAPW, 0, 0, TH / MAPH, 0, 0);
  g.strokeStyle = 'rgba(246,240,226,.42)'; g.lineWidth = 0.7;
  for (const p of paths) g.stroke(p);

  g.setTransform(1, 0, 0, 1, 0, 0);
  const ice = g.createLinearGradient(0, 0, 0, TH * 0.085);
  ice.addColorStop(0, 'rgba(228,238,246,.62)');
  ice.addColorStop(.55, 'rgba(228,238,246,.18)');
  ice.addColorStop(1, 'rgba(228,238,246,0)');
  g.fillStyle = ice; g.fillRect(0, 0, TW, TH * 0.085);
  const ice2 = g.createLinearGradient(0, TH, 0, TH * 0.915);
  ice2.addColorStop(0, 'rgba(232,240,246,.78)');
  ice2.addColorStop(.55, 'rgba(232,240,246,.22)');
  ice2.addColorStop(1, 'rgba(232,240,246,0)');
  g.fillStyle = ice2; g.fillRect(0, TH * 0.915, TW, TH * 0.085);

  baseCanvas = c;
}

/* ───────────── 6. WebGL ───────────── */
const VERT = `
attribute vec3 aPos;
attribute vec2 aUv;
uniform mat3 uRot;
uniform vec2 uCenter;
uniform vec2 uViewport;
uniform float uScale;
varying vec2 vUv;
varying vec3 vN;
void main() {
  vec3 p = uRot * aPos;
  vec2 screen = uCenter + vec2(p.x, p.y) * uScale;
  gl_Position = vec4((screen / uViewport) * 2.0 - 1.0, -p.z, 1.0);
  vUv = aUv;
  vN = p;
}`;

const FRAG = `
precision mediump float;
varying vec2 vUv;
varying vec3 vN;
uniform sampler2D uBase;
uniform sampler2D uId;
uniform sampler2D uLut;
uniform vec3 uLight;
uniform float uSel;
void main() {
  vec3 n = normalize(vN);
  vec3 base = texture2D(uBase, vUv).rgb;
  vec4 idTex = texture2D(uId, vUv);
  float idx = floor(idTex.r * 255.0 + 0.5);
  vec4 tint = texture2D(uLut, vec2((idx + 0.5) / 256.0, 0.5));
  vec3 col = mix(base, tint.rgb, tint.a);
  float edge = smoothstep(0.25, 0.75, idTex.b);
  col = mix(col, vec3(0.38, 0.36, 0.31), edge * 0.62);
  if (uSel > 0.5 && abs(idx - uSel) < 0.5) col = mix(col, vec3(1.0, 0.96, 0.86), 0.26);
  float l = dot(n, uLight);
  float lam = clamp(l, 0.0, 1.0);
  vec3 lit = col * (0.42 + 0.78 * pow(lam, 0.7));
  float day = smoothstep(-0.24, 0.38, l);
  col = mix(col * 0.32, lit, day);
  float rim = pow(1.0 - clamp(n.z, 0.0, 1.0), 3.2);
  col += vec3(0.30, 0.46, 0.64) * rim * 0.45;
  gl_FragColor = vec4(col, 1.0);
}`;

const VERT_ATM = `
attribute vec2 aPos;
uniform vec2 uCenter;
uniform vec2 uViewport;
uniform float uScale;
varying vec2 vP;
void main() {
  vP = aPos * 1.42;
  vec2 screen = uCenter + vP * uScale;
  gl_Position = vec4((screen / uViewport) * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG_ATM = `
precision mediump float;
varying vec2 vP;
uniform vec3 uAtm;
void main() {
  float r = length(vP);
  float a = 0.0;
  if (r > 0.94) {
    float inner = smoothstep(0.94, 1.04, r);
    float t = clamp(1.0 - (r - 1.0) / 0.55, 0.0, 1.0);
    a = inner * pow(t, 3.0) * 0.42;
  }
  gl_FragColor = vec4(uAtm, a);
}`;

function mul3(a, b) {
  const out = new Array(9);
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      out[c * 3 + r] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
    }
  }
  return out;
}

function initGL() {
  const opts = { alpha: true, antialias: true, depth: true, premultipliedAlpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' };
  let gl = null;
  try { gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts); } catch (_) { gl = null; }
  if (!gl) return null;
  const shader = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn('shader', gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const program = (vs, fs) => {
    const p = gl.createProgram();
    const v = shader(gl.VERTEX_SHADER, vs), f = shader(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.warn('link', gl.getProgramInfoLog(p)); return null; }
    return p;
  };
  const prog = program(VERT, FRAG), progAtm = program(VERT_ATM, FRAG_ATM);
  if (!prog || !progAtm) return null;

  const LON = 192, LAT = 96;
  const verts = new Float32Array((LON + 1) * (LAT + 1) * 5);
  let k = 0;
  for (let j = 0; j <= LAT; j++) {
    const v = j / LAT, lat = (0.5 - v) * Math.PI;
    const cy = Math.sin(lat), cr = Math.cos(lat);
    for (let i = 0; i <= LON; i++) {
      const u = i / LON, lon = (u - 0.5) * TAU;
      verts[k++] = cr * Math.sin(lon); verts[k++] = cy; verts[k++] = cr * Math.cos(lon);
      verts[k++] = u; verts[k++] = v;
    }
  }
  const idx = new Uint16Array(LON * LAT * 6);
  let m = 0;
  for (let j = 0; j < LAT; j++) {
    for (let i = 0; i < LON; i++) {
      const a = j * (LON + 1) + i, b = a + 1, c = a + LON + 1, d = c + 1;
      idx[m++] = a; idx[m++] = c; idx[m++] = b;
      idx[m++] = b; idx[m++] = c; idx[m++] = d;
    }
  }
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos'), aUv = gl.getAttribLocation(prog, 'aUv');
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPosAtm = gl.getAttribLocation(progAtm, 'aPos');

  const U = {

/* ───────────── 7. Canvas2D 兜底 ───────────── */
let fallback = null;
function initFallback() {
  const cv = canvas;
  const ctx = cv.getContext('2d');
  if (!ctx) return null;
  const off = newCanvas(1, 1);
  const octx = off.getContext('2d');
  let src = null, sphere = null;
  return {
    kind: 'canvas2d',
    prepare() { src = baseCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, TW, TH).data; },
    resize(w, h, dpr) { cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr)); },
    draw(v, st) {
      if (!src) return;
      const D = clamp(Math.round(v.Rz * 2 * v.dpr), 160, 520);
      if (off.width !== D) { off.width = D; off.height = D; sphere = octx.createImageData(D, D); }
      const buf = sphere.data, c0 = D / 2, rad = D / 2 - 0.5;
      const ct = Math.cos(st.tilt), stt = Math.sin(st.tilt);
      const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
      const sel = st.focus ? st.focus.id : 0;
      const lx = -0.52, ly = 0.44, lz = 0.73;
      for (let py = 0; py < D; py++) {
        const ny = (py + 0.5 - c0) / rad, ys = -ny;
        for (let px = 0; px < D; px++) {
          const nx = (px + 0.5 - c0) / rad, rr = nx * nx + ny * ny, o = (py * D + px) << 2;
          if (rr >= 1) { buf[o + 3] = 0; continue; }

          const y1 = ys * ct + nz * stt, z1 = -ys * stt + nz * ct;
          const mx = nx * cy - z1 * sy, mz = nx * sy + z1 * cy;
          const lat = Math.asin(clamp(y1, -1, 1));

          const vv = 0.5 - lat / Math.PI;
          const col = Math.min(TW - 1, Math.max(0, (u * TW) | 0));
          const row = Math.min(TH - 1, Math.max(0, (vv * TH) | 0));
          const si = (row * TW + col) << 2;
          let r = src[si], g = src[si + 1], b = src[si + 2];
          const id = partition.pick[((row >> 1) * PW) + (col >> 1)];
          if (id) {
            const lo = id << 2, a = partition.lut[lo + 3] / 255;

            g += (partition.lut[lo + 1] - g) * a;
            b += (partition.lut[lo + 2] - b) * a;

          }

          buf[o + 2] = Math.min(255, b + 163 * rim);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(off, (v.cx + st.panX) * v.dpr - Rz, (v.cy + st.panY) * v.dpr - Rz, Rz * 2, Rz * 2);
    },
  };
}

/* ───────────── 8. 布局与拾取 ───────────── */
function layout() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 3);
  view.w = w; view.h = h; view.dpr = dpr;
  view.cx = w / 2;
  view.cy = clamp(h * 0.42, h * 0.32, h * 0.50);
  view.R = Math.min(w * 0.435, h * 0.30, 320);
  clampPan();
  view.Rz = view.R * state.zoom;
  const r = glr || fallback;
  if (r) r.resize(w, h, dpr);
  draw();
}

function clampPan() {
  const Rz = view.R * state.zoom;
  const mx = Math.max(0, Rz - view.w * 0.5 + 18);
  const my = Math.max(0, Rz - view.h * 0.5 + 18);
  state.panX = clamp(state.panX, -mx, mx);
  state.panY = clamp(state.panY, -my, my);
}

/* 屏幕坐标 → 1000×500 地图坐标 */
function mapPointAt(sx, sy) {
  const Rz = view.R * state.zoom;
  const dx = (sx - view.cx - state.panX) / Rz;
  const dy = -(sy - view.cy - state.panY) / Rz;
  const rr = dx * dx + dy * dy;
  if (rr >= 1) return null;
  const wz = Math.sqrt(1 - rr);
  const ct = Math.cos(state.tilt), stt = Math.sin(state.tilt);
  const cy = Math.cos(state.yaw), sy2 = Math.sin(state.yaw);
  const y1 = dy * ct + wz * stt, z1 = -dy * stt + wz * ct;
  const mx = dx * cy - z1 * sy2, mz = dx * sy2 + z1 * cy;
  const lat = Math.asin(clamp(y1, -1, 1));
  let u = Math.atan2(mx, mz) / TAU + 0.5;
  if (u < 0) u += 1; else if (u >= 1) u -= 1;
  return { x: u * MAPW, y: (0.5 - lat / Math.PI) * MAPH };
}

function pickAt(sx, sy) {
  const p = mapPointAt(sx, sy);
  if (!p) return 0;
  const col = Math.min(PW - 1, Math.max(0, (p.x / MAPW * PW) | 0));
  const row = Math.min(PH - 1, Math.max(0, (p.y / MAPH * PH) | 0));
  /* 3×3 多数表决：两个 id 交界处的混色会算出第三个 id，表决把它压掉 */
  const tally = new Map();
  for (let dy = -1; dy <= 1; dy++) {
    const r = row + dy;
    if (r < 0 || r >= PH) continue;
    for (let dx = -1; dx <= 1; dx++) {
      const c = col + dx;
      if (c < 0 || c >= PW) continue;
      const v = partition.pick[r * PW + c];
      if (v) tally.set(v, (tally.get(v) || 0) + 1);
    }
  }
  let best = 0, bestN = 0;
  for (const [v, n] of tally) if (n > bestN) { best = v; bestN = n; }
  return best;
}

/* ───────────── 9. 实体 ───────────── */
function entityById(layerId, id) {
  const layer = LAYERS[layerId];
  const shape = partition.shapes.find((s) => s.id === id);
  if (!shape) return null;
  const base = layer.entityOfShape(shape);
  if (!base) return null;
  if (base.kind === 'country') {
    const r = base.region;
    return {
      kind: 'country', id, layerId,
      name: r.zh || r.en || r.iso, nameEn: r.en || '', iso: r.iso,
      from: null, to: null, regionId: r.id,
      total: (entryByRegion.get(r.id) || []).length,
    };
  }
  const e = base.ent;
  return {
    kind: 'polity', id, layerId,
    name: e.name, nameEn: e.name,
    from: e.from, to: e.to, entId: e.id,
    total: null,
  };
}

/* 某实体在当前年份窗口内的条目 */
function entriesOfEntity(ent) {
  if (!ent) return [];
  const [a, b] = windowOf(state.year), oa = ord(a), ob = ord(b);
  if (ent.kind === 'country') {
    return entries.filter((e) => e.region === ent.regionId && e.t1 >= oa && e.t0 <= ob);
  }
  /* 政权：条目代表点落在它的疆域内，且时间与存续期相交 */
  const out = [];
  for (const e of entries) {
    if (e.px === undefined) continue;
    if (e.t1 < Math.max(oa, ent.from) || e.t0 > Math.min(ob, ent.to)) continue;
    if (pickAtMap(e.px, e.py) !== ent.id) continue;
    out.push(e);
  }
  return out;
}
function pickAtMap(mx, my) {
  const col = Math.min(PW - 1, Math.max(0, (mx / MAPW * PW) | 0));
  const row = Math.min(PH - 1, Math.max(0, (my / MAPH * PH) | 0));
  return partition.pick[row * PW + col];
}

/* 相邻实体（同一年、共享边界的其它 id） */
function neighboursOf(id, limit = 6) {
  const seen = new Map();
  const pick = partition.pick;
  for (let y = 1; y < PH - 1; y++) {
    for (let x = 1; x < PW - 1; x++) {
      const i = y * PW + x;
      if (pick[i] !== id) continue;
      const n = [pick[i - 1], pick[i + 1], pick[i - PW], pick[i + PW]];
      for (const v of n) if (v && v !== id) seen.set(v, (seen.get(v) || 0) + 1);
    }
  }
  /* 阈值 + 面积占比，滤掉栅格化噪声连出来的“假邻居” */
  const mine = [...pick].filter((v) => v === id).length;
  const minShare = Math.max(24, mine * 0.01);
  return [...seen.entries()]
    .filter(([, n]) => n >= minShare)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([v]) => v);
}

/* 政权 → 今天的国家（空间重叠） */
const probeCanvas = newCanvas(PW, PH);
const probeCtx = probeCanvas.getContext('2d', { willReadFrequently: true });

function countriesUnderPolity(ent, limit = 4) {
  const g = probeCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000';
  g.fillRect(0, 0, PW, PH);
  g.setTransform(PW / MAPW, 0, 0, PH / MAPH, 0, 0);
  g.fillStyle = '#fff';
  for (const s of partition.shapes) {
    if (s.id !== ent.id) continue;
    g.fill(polityShape(pk, s.pathId).path, 'evenodd');
  }
  const px = g.getImageData(0, 0, PW, PH).data;
  const tally = new Map();
  for (let i = 0, p = 0; i < PW * PH; i++, p += 4) {
    if (px[p] < 128) continue;
    const cid = countryPick[i];
    if (cid) tally.set(cid, (tally.get(cid) || 0) + 1);
  }
  let total = 0;
  for (const v of tally.values()) total += v;
  return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit)
    .map(([id, n]) => ({ iso: mapShapes[id - 1] ? mapShapes[id - 1].iso : '', pct: n / Math.max(1, total) }));
}

/* 某一年的政权栅格（独立于主分区，512×256，几毫秒） */
const polityProbeCache = { year: NaN, shapes: [], pick: null };
function polityProbe(year) {
  if (!pk) return null;
  if (polityProbeCache.year === year) return polityProbeCache;
  const shapes = LAYERS.polity.shapes(year);
  const g = probeCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, PW, PH);
  g.setTransform(PW / MAPW, 0, 0, PH / MAPH, 0, 0);
  for (const s of shapes) {
    g.fillStyle = 'rgb(' + s.id + ',255,0)';
    g.fill(polityShape(pk, s.pathId).path, 'evenodd');
  }
  const px = g.getImageData(0, 0, PW, PH).data;
  const pick = new Uint8Array(PW * PH);
  for (let i = 0, p = 0; i < pick.length; i++, p += 4) {
    const cover = px[p + 1];
    if (cover > 100) pick[i] = Math.round((px[p] * 255) / cover);
  }
  polityProbeCache.year = year;
  polityProbeCache.shapes = shapes;
  polityProbeCache.pick = pick;
  return polityProbeCache;
}

/* 国家 → 这一年的政权（取代表点所在 id） */
function polityOverCountry(iso) {
  if (!pk) return null;
  const centre = regionCentroid(iso);
  if (!centre) return null;
  const probe = polityProbe(LAYERS.polity.currentYear(state.year));
  if (!probe) return null;
  const col = Math.min(PW - 1, Math.max(0, (centre[0] / MAPW * PW) | 0));
  const row = Math.min(PH - 1, Math.max(0, (centre[1] / MAPH * PH) | 0));
  const id = probe.pick[row * PW + col];
  if (!id) return null;

}
function regionCentroid(iso) {
  const r = regionByIso.get(iso);
  if (!r) return null;
  const e = entries.find((x) => x.px !== undefined && x.region === r.id);
  return e ? [e.px, e.py] : null;

/* 现代国家的拾取栅格（政权页要用，静态建一次） */
let countryPick = new Uint8Array(PW * PH);
function buildCountryPick() {
  const save = state.layerId;
  const { pick } = rasterize(LAYERS.country, 2026);
  countryPick = pick;
  state.layerId = save;
}

/* ───────────── 10. 渲染调度 ───────────── */

  if (spinning && pointers.size === 0 && !pinch) { state.yaw -= 0.055 * dt; dirty = true; busy = true; }
  if (applyMomentum(dt)) { dirty = true; busy = true; }
  if (dirty) { dirty = false; draw(); }
  if (busy || dirty) rafId = requestAnimationFrame(frame);
}
function draw() {
  const r = glr || fallback;
  if (!r || !baseCanvas) return;
  r.draw(view, state);
}

/* ───────────── 11. 交互 ───────────── */

  state.tilt = clamp(state.tilt + momentum.tilt * dt, -0.62, 1.02);
  const damp = Math.pow(0.0016, dt);
  momentum.yaw *= damp; momentum.tilt *= damp;
  if (Math.abs(momentum.yaw) < 0.01) momentum.yaw = 0;
  if (Math.abs(momentum.tilt) < 0.01) momentum.tilt = 0;
  return true;
}

let lastTapAt = 0, lastTapPos = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', (e) => {
  hideHint();
  momentum.yaw = momentum.tilt = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
  if (pointers.size === 1) {
    drag = { last: performance.now(), vy: 0, vt: 0 };
    pinch = null;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = {
      d: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      zoom: state.zoom, px: state.panX, py: state.panY,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
    };
    drag = null; momentum.yaw = momentum.tilt = 0;
  }

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.moved += Math.abs(dx) + Math.abs(dy);
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const z = clamp((pinch.zoom * d) / pinch.d, 1, 6);
    const k = z / state.zoom;
    state.panX = (pinch.cx - view.cx) - k * (pinch.cx - view.cx - pinch.px);
    state.panY = (pinch.cy - view.cy) - k * (pinch.cy - view.cy - pinch.py);

    return;
  }

  const now = performance.now();
  const dts = Math.max(0.008, (now - drag.last) / 1000);

  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!p) return;
  if (pointers.size === 0 && drag) {
    momentum.yaw = clamp(drag.vy * 0.5, -3, 3);
    momentum.tilt = clamp(drag.vt * 0.3, -1.4, 1.4);
    drag = null;
    invalidate();
  }
  if (e.type === 'pointerup' && p.moved < 10 && performance.now() - p.t < 320) {
    const now = performance.now();
    const isDouble = now - lastTapAt < 300 && Math.hypot(e.clientX - lastTapPos.x, e.clientY - lastTapPos.y) < 26;
    lastTapAt = now; lastTapPos = { x: e.clientX, y: e.clientY };
    if (isDouble) { zoomTo(state.zoom > 1.4 ? 1 : 2.4, e.clientX, e.clientY); lastTapAt = 0; return; }
    tapGlobe(e.clientX, e.clientY);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomTo(clamp(state.zoom * Math.exp(-e.deltaY * 0.0016), 1, 6), e.clientX, e.clientY);
}, { passive: false });

let zoomAnim = 0;
function zoomTo(z, ax, ay) {
  z = clamp(z, 1, 6);
  const from = state.zoom, R = view.R;
  const dx = (ax == null ? view.cx : ax) - view.cx;
  const dy = (ay == null ? view.cy : ay) - view.cy;
  const px0 = state.panX, py0 = state.panY;
  const apply = (k) => {
    state.zoom = from + (z - from) * k;
    const ratio = state.zoom / from;
    state.panX = dx - ratio * (dx - px0);
    state.panY = dy - ratio * (dy - py0);
    clampPan();
    view.Rz = R * state.zoom;
    invalidate();
  };
  if (z === from) return;
  cancelAnimationFrame(zoomAnim);
  const t0 = performance.now();
  const step = (t) => {
    const k = clamp((t - t0) / 220, 0, 1);
    apply(k < 1 ? 1 - Math.pow(1 - k, 3) : 1);
    if (k < 1) zoomAnim = requestAnimationFrame(step);
  };
  zoomAnim = requestAnimationFrame(step);
}

function tapGlobe(sx, sy) {
  const id = pickAt(sx, sy);
  if (!id) { closeSheet(); return; }
  openEntity(state.layerId, id);
}

/* ───────────── 12. 抽屉（统一实体模板） ───────────── */
const KIND_LABEL = { country: '现代国家', polity: '政权' };

function renderSheet() {
  const f = state.focus;
  if (!f) return;
  const ent = entityById(f.layerId, f.id);
  if (!ent) { closeSheet(); return; }
  const listAll = entriesOfEntity(ent);
  const [a, b, scopeName] = windowOf(state.year);
  const span = a === b ? fmtYear(a) + ' 年' : fmtYear(a) + '–' + fmtYear(b);
  listAll.sort((x, z) => (z.kind === 'era') - (x.kind === 'era') || z.t0 - x.t0);
  const era = listAll.find((e) => e.kind === 'era');
  /* 同一件事会在多个国家各有一条（“奥斯曼统治”×4），档案里只留一条 */
  const seenTitle = new Set();
  const rest = listAll.filter((e) => e !== era && e !== era).filter((e) => {
    const key = e.zh || e.en;
    if (seenTitle.has(key)) return false;
    seenTitle.add(key);
    return true;
  }).slice(0, 8);

  let facts = '';
  if (ent.kind === 'polity') {
    facts += '<li><i class="dot"></i><span>存续</span><small>' + fmtYear(ent.from) + '–' + fmtYear(ent.to) + '</small></li>';
    const today = countriesUnderPolity(ent);
    if (today.length) {
      facts += '<li><i class="dot"></i><span>今天的疆域主要在 ' + today.map((t) => esc(isoName(t.iso))).join(' · ') + '</span><small></small></li>';
    }
    const nb = neighboursOf(ent.id);
    if (nb.length) {
      const names = nb.map((id) => {
        const s = partition.shapes.find((x) => x.id === id);
        return s ? esc(s.ent.name) : '';
      }).filter(Boolean);
      if (names.length) facts += '<li><i class="dot"></i><span>同期邻居 ' + names.slice(0, 4).join('、') + '</span><small></small></li>';
    }
  } else {
    facts += '<li><i class="dot"></i><span>年表收录</span><small>' + ent.total + ' 条</small></li>';
    const pol = polityOverCountry(ent.iso);
    if (pol) facts += '<li><i class="dot"></i><span>' + fmtYear(state.year) + ' 年这里是 ' + esc(pol.name) + '</span><small></small></li>';
  }

  const rows = rest.map((e) =>
    '<li><i style="background:' + kindColor(e) + '"></i><span>' + esc(e.zh || e.en) +
    '</span><small>' + dateOf(e) + '</small></li>').join('');

  sheetInner.innerHTML =
    '<h2>' + esc(ent.name) + (ent.nameEn && ent.nameEn !== ent.name ? '<em>' + esc(ent.nameEn) + '</em>' : '') + '</h2>' +
    '<p class="era">' + KIND_LABEL[ent.kind] + ' · ' + esc(scopeName) + '<small>' + span + '</small></p>' +
    '<button type="button" id="read-btn">读这一卷 →</button>' +
    '<ul class="facts">' + facts + '</ul>' +
    (era ? '<p class="era2">' + esc(era.zh || era.en) + '<small>' + dateOf(era) + '</small></p>' : '') +
    (rows ? '<ul>' + rows + '</ul>' : '<p class="empty">这个年份附近没有收录条目。</p>') +
    '<p class="foot">边界按现代国界近似' + (ent.kind === 'polity' ? ' · 历史疆界来自 Cliopatria（CC BY 4.0）' : '') + '</p>';
  sheetEl.classList.add('open');
  const rb = document.getElementById('read-btn');
  if (rb) rb.addEventListener('click', openBook);
}

function openEntity(layerId, id) {
  state.focus = { layerId, id };

  invalidate();
}
function closeSheet() {

}

function isoName(iso) {
  if (world && world.isoNames && world.isoNames[iso]) return world.isoNames[iso];
  const r = regionByIso.get(iso);
  return r ? (r.zh || r.en || iso) : iso;
}
const KIND = {
  era: ['朝代 / 政权', '#6f93b8'], war: ['战争', '#c0766d'], movement: ['思潮', '#9a86b8'],
  colonial: ['殖民', '#c08355'], religion: ['宗教', '#b79a5f'], economy: ['经济', '#6aa88c'],

  other: ['其他', '#8a9a7a'],
};
const kindOf = (e) => KIND[e.kind] || KIND.other;
const kindColor = (e) => kindOf(e)[1];
function dateOf(e) { return e.point ? fmtYear(e.start) + ' 年' : fmtYear(e.start) + '–' + fmtYear(e.end); }

/* ───────────── 13. 全景列表 ───────────── */
function openWorld() {
  const [a, b, scope] = windowOf(state.year);
  const oa = ord(a), ob = ord(b), t = ord(state.year);
  const list = [];
  for (const e of entries) if (e.t1 >= oa && e.t0 <= ob) list.push({ e, d: e.t0 > t ? e.t0 - t : t - e.t1 });
  list.sort((p, q) => p.d - q.d || q.e.t0 - p.e.t0);
  const cap = 90;
  const groups = new Map();
  for (const row of list.slice(0, cap)) {
    let g = row.e.regionRef || regionById.get(row.e.region);
    let guard = 0;
    while (g && g.parent && guard++ < 8) g = regionById.get(g.parent) || g;
    const key = (g && (g.zh || g.en)) || '其他';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row.e);
  }
  overlayTitle.textContent = state.year >= YMAX ? '今天' : fmtYear(state.year) + ' 年';
  overlaySub.innerHTML = scope + ' · <b>' + summary.entities + '</b> 个' + LAYERS[state.layerId].name +
    ' · <b>' + (summary.ev) + '</b> 条事件' + (list.length > cap ? ' · 前 ' + cap + ' 条' : '');
  if (!list.length) {
    overlayBody.innerHTML = '<p class="wempty">这一年还没有收录条目。</p>';
  } else {
    let html = '';
    for (const [gname, rows] of [...groups.entries()].sort((x, y) => y[1].length - x[1].length)) {
      html += '<div class="wgroup">' + esc(gname) + ' · ' + rows.length + '</div>';
      for (const e of rows) {
        const r = regionById.get(e.region) || {};
        html += '<div class="wrow" data-region="' + esc(r.id || '') + '">' +
          '<i style="background:' + kindColor(e) + '"></i>' +
          '<div class="t">' + esc(e.zh || e.en) + '<span class="m">' + esc(r.zh || '') + ' · ' + kindOf(e)[0] + '</span></div>' +
          '<div class="y">' + esc(dateOf(e)) + '</div></div>';
      }
    }
    overlayBody.innerHTML = html;
  }
  overlay.hidden = false;
  overlayBody.scrollTop = 0;
}
overlayBody.addEventListener('click', (e) => {

/* ───────────── 13.5 阅读视图（一本书） ───────────── */
/* 书 = 实体在某个时期的一组节：导语（来自维基）+ 按时间分节的事件段落 + 出处。
   数据在 data/stories.json（条目 id → 中文维基导语）。 */
let stories = null, storiesLoading = false;
const bookEl = el('book'), bookBody = el('book-body'), bookCrumb = el('book-crumb');

async function loadStories() {
  if (stories || storiesLoading) return;
  storiesLoading = true;
  try {
    const inline = inlineText('stories');
    if (inline.length > 50) stories = JSON.parse(inline);
    else stories = await (await fetch('data/stories.json')).json();
  } catch (e) {
    stories = { entries: {}, polities: {} };
    console.warn('stories 读取失败', e);
  }
  storiesLoading = false;
}

const proseOf = (entryId) => (stories && stories.entries[entryId] && stories.entries[entryId].x) || '';
const polityProse = (name) => (stories && stories.polities[name] && stories.polities[name].x) || '';
const polityZhName = (name) => (stories && stories.polities[name] && stories.polities[name].t) || name;

/* 政权全部切片的并集遮罩：用来把散落在它一生的条目找出来 */
const polityMaskCache = new Map();
function polityMaskOf(ent) {
  const key = ent.entId;
  if (polityMaskCache.has(key)) return polityMaskCache.get(key);
  const g = probeCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, PW, PH);
  g.setTransform(PW / MAPW, 0, 0, PH / MAPH, 0, 0);
  g.fillStyle = '#fff';
  for (let i = 0; i < pk.nSlice; i++) {
    if (pk.slices[i * 4] !== ent.entId) continue;
    g.fill(polityShape(pk, pk.slices[i * 4 + 3]).path, 'evenodd');
  }
  const px = g.getImageData(0, 0, PW, PH).data;
  const mask = new Uint8Array(PW * PH);
  for (let i = 0, p = 3; i < mask.length; i++, p += 4) mask[i] = px[p] > 128 ? 1 : 0;
  polityMaskCache.set(key, mask);
  if (polityMaskCache.size > 40) polityMaskCache.delete(polityMaskCache.keys().next().value);
  return mask;
}

/* 这一卷要读哪些条目：国家读它全部的年表，政权读它一生境内的事 */
function entriesForBook(ent) {
  if (ent.kind === 'country') {
    return (entryByRegion.get(ent.regionId) || []).slice();
  }
  const mask = polityMaskOf(ent);
  const out = [];
  for (const e of entries) {
    if (e.px === undefined) continue;
    if (e.t1 < ent.from || e.t0 > ent.to) continue;
    const col = Math.min(PW - 1, Math.max(0, (e.px / MAPW * PW) | 0));
    const row = Math.min(PH - 1, Math.max(0, (e.py / MAPH * PH) | 0));
    if (mask[row * PW + col]) out.push(e);
  }
  return out;
}

function buildChapter(ent) {
  const list = entriesForBook(ent).sort((a, b) => a.t0 - b.t0);
  const chapters = [];
  let cur = null;
  for (const e of list) {
    const bucket = Math.floor(e.start / 100) * 100;
    if (!cur || cur.bucket !== bucket) {
      cur = { bucket, from: bucket, to: bucket + 99, items: [] };
      chapters.push(cur);
    }
    cur.items.push(e);
  }
  const sections = chapters.map((c) => ({
    heading: c.bucket < 0 ? '前' + (-c.bucket) + '–前' + (-c.bucket - 99) : c.from + '–' + c.to,
    here: Math.floor(state.year / 100) * 100 === c.bucket,
    items: c.items.map((e) => ({
      title: e.zh || e.en,
      meta: dateOf(e),
      color: kindColor(e),
      prose: proseOf(e.id),
      source: e.source || '',
      year: e.start,
    })),
  }));

  let lede = '';
  let title = ent.name, when = '';
  if (ent.kind === 'polity') {
    title = polityZhName(ent.name);
    when = fmtYear(ent.from) + '–' + fmtYear(ent.to) + ' · 存续 ' + (ent.to - ent.from) + ' 年 · 境内 ' + list.length + ' 条记录';
    lede = polityProse(ent.name);
  } else {
    const pol = pk ? polityOverCountry(ent.iso) : null;
    const polZh = pol ? polityZhName(pol.name) : '';
    when = fmtYear(state.year) + ' 年 · 年表 ' + list.length + ' 条' + (polZh ? ' · 这一年是 ' + polZh : '');
    if (pol) lede = polityProse(pol.name);
    if (!lede) lede = '这里收着' + ent.name + '的年表：从最早的一条到最近的记录，按时间排开。';
  }
  return { title, when, lede, sections, kind: ent.kind };
}

function openBook() {
  const f = state.focus;
  if (!f) return;
  const ent = entityById(f.layerId, f.id);
  if (!ent) return;
  const paint = () => {
    const ch = buildChapter(ent);
    const [a, b, scopeName] = windowOf(state.year);
    bookCrumb.textContent = (ent.kind === 'polity' ? '政权' : scopeName) + ' · ' + (state.year >= YMAX ? '今天' : fmtYear(state.year) + ' 年');
    const sections = ch.sections.filter((s) => s.items.length).map((s) => `
      <h2${s.here ? ' class="here"' : ''}>${esc(s.heading)}<em>${s.items.length} 条</em></h2>
      ${s.items.map((it) => `
        <article>
          <h3>${esc(it.title)}</h3>
          <p class="meta"><i style="background:${it.color}"></i>${esc(it.meta)}</p>
          ${it.prose ? `<p>${esc(it.prose)}</p>` : '<p class="noprose">（这一条还没有正文）</p>'}
          ${it.source ? `<a class="src" href="${esc(it.source)}" target="_blank" rel="noopener">维基百科 ↗</a>` : ''}
        </article>`).join('')}`).join('');
    const titles = [...new Set((stories ? ch.sections.flatMap((s) => s.items) : []).map((i) => i.title))].slice(0, 6);
    bookBody.innerHTML = `
      <p class="eyebrow">${ch.kind === 'polity' ? '政权档案' : chapterOf(state.year).n}</p>
      <h1>${esc(ch.title)}</h1>
      <p class="when">${ch.when}</p>
      ${ch.lede ? `<p class="lede">${esc(ch.lede)}</p>` : ''}
      ${sections || '<p class="noprose">这一段还没有收进条目。</p>'}
      <div class="more">
        <button type="button" data-act="prev">◀ 上一个时期</button>
        <button type="button" data-act="next">下一个时期 ▶</button>
        <button type="button" data-act="close">回到地球</button>
      </div>
      <p class="credits">
        <b>正文</b>：中文维基百科导语（CC BY-SA 4.0），条目名 ${titles.length ? esc(titles.join('、')) : '—'}<br>
        <b>边界</b>：Cliopatria / Seshat（CC BY 4.0）· <b>国界</b>：Natural Earth（公有领域）<br>
        正文由导语拼接而成，不是逐段核对过的通史；年份与出处以年表为准。
      </p>`;
    bookBody.scrollTop = 0;
    bookEl.hidden = false;
    /* 打开就落到「此刻」所在的那一节 */
    const here = bookBody.querySelector('h2.here');
    if (here) setTimeout(() => { bookBody.scrollTop = Math.max(0, here.offsetTop - 70); }, 60);
  };
  if (!stories) {
    bookBody.innerHTML = '<p class="eyebrow">正在装订…</p>';
    bookEl.hidden = false;
    loadStories().then(paint);
  } else paint();
}

function closeBook() { bookEl.hidden = true; }
el('book-close').addEventListener('click', closeBook);
bookBody.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') { closeBook(); return; }
  const ch = chapterOf(state.year);
  const step = act === 'next' ? 1 : -1;
  const i = CH.indexOf(ch);
  const next = CH[clamp(i + step, 0, CH.length - 1)];
  if (next) {
    state.year = act === 'next' ? next.a : next.b;
    onYearChanged();
    openBook();
  }
});

/* ───────────── 14. 时间轴 ───────────── */
let density = null;
function buildDensity() {
  const N = YMAX - YMIN + 1;
  const hist = new Float32Array(N);
  for (const e of entries) {
    const a = Math.max(YMIN, Math.ceil(e.start));
    const b = Math.min(YMAX, Math.floor(e.point ? e.start : e.end));
    for (let y = a; y <= b; y++) hist[y - YMIN]++;
  }
  const sm = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let s = 0, c = 0;
    for (let k = -5; k <= 5; k++) { const j = i + k; if (j >= 0 && j < N) { s += hist[j]; c++; } }
    sm[i] = s / c;
  }
  let mx = 0;
  for (const v of sm) if (v > mx) mx = v;
  density = { sm, mx: mx || 1 };
}

const T_PADL = 18, T_PADR = 18, T_H = 96;
let trackW = 0;
function layoutTrack() {
  trackW = track.clientWidth || innerWidth;
  const dpr = Math.min(devicePixelRatio || 1, 3);
  track.width = Math.round(trackW * dpr);
  track.height = Math.round(T_H * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const xOfPos = (p) => T_PADL + p * (trackW - T_PADL - T_PADR);

function drawTrack() {
  if (!density) buildDensity();
  const w = trackW;
  tctx.clearRect(0, 0, w, T_H);
  const labelY = 13, top = 24, areaH = 24, railY = 62, footY = 82;
  const x0 = xOfPos(0), x1 = xOfPos(1);
  const active = chapterOf(state.year);
  for (let i = 0; i < CH.length; i++) {
    const c = CH[i];
    const a = xOfPos(cum[i]), b = xOfPos(cum[i] + c.w);
    tctx.fillStyle = i % 2 ? 'rgba(255,255,255,.028)' : 'rgba(255,255,255,.012)';
    tctx.fillRect(a, top - 3, b - a, areaH + 6);
    if (b - a > 34 || c === active) {
      tctx.font = '10.5px -apple-system,system-ui,sans-serif';
      tctx.textAlign = 'center';
      tctx.fillStyle = c === active ? 'rgba(224,178,115,.95)' : 'rgba(142,153,168,.75)';
      tctx.fillText(c.n, (a + b) / 2, labelY);
    }
  }
  const N = YMAX - YMIN + 1, steps = 200, lmax = Math.log1p(density.mx);
  tctx.beginPath();
  tctx.moveTo(x0, top + areaH);
  for (let s = 0; s <= steps; s++) {
    const p = s / steps, y = YMIN + Math.round(p * (YMAX - YMIN));
    const v = Math.log1p(density.sm[clamp(y - YMIN, 0, N - 1)]) / lmax;
    tctx.lineTo(xOfPos(p), top + areaH - v * areaH);
  }
  tctx.lineTo(x1, top + areaH);
  tctx.closePath();
  tctx.fillStyle = 'rgba(224,178,115,.12)'; tctx.fill();
  tctx.strokeStyle = 'rgba(224,178,115,.26)'; tctx.lineWidth = 1; tctx.stroke();

  tctx.strokeStyle = 'rgba(255,255,255,.14)'; tctx.lineWidth = 2; tctx.lineCap = 'round';
  tctx.beginPath(); tctx.moveTo(x0, railY); tctx.lineTo(x1, railY); tctx.stroke();
  const px = xOfPos(posOfYear(state.year));
  tctx.strokeStyle = 'rgba(224,178,115,.45)';
  tctx.beginPath(); tctx.moveTo(x0, railY); tctx.lineTo(px, railY); tctx.stroke();
  tctx.strokeStyle = 'rgba(224,178,115,.30)'; tctx.lineWidth = 1;
  tctx.beginPath(); tctx.moveTo(px, top - 2); tctx.lineTo(px, railY - 8); tctx.stroke();

  tctx.font = '10px -apple-system,system-ui,sans-serif';
  tctx.textAlign = 'left'; tctx.fillStyle = 'rgba(142,153,168,.7)';
  tctx.fillText('前 3500', x0, footY);
  tctx.textAlign = 'right'; tctx.fillStyle = 'rgba(224,178,115,.95)';
  tctx.fillText('今天', x1, footY);
  tctx.textAlign = 'center'; tctx.fillStyle = 'rgba(142,153,168,.55)';
  tctx.fillText('元年', xOfPos(posOfYear(0)), footY);

  tctx.fillStyle = '#e0b273';
  tctx.beginPath(); tctx.arc(px, railY, 8, 0, TAU); tctx.fill();
  tctx.fillStyle = '#0b1017';
  tctx.beginPath(); tctx.arc(px, railY, 3, 0, TAU); tctx.fill();
}

function posFromX(clientX) {
  const r = track.getBoundingClientRect();
  return clamp((clientX - r.left - T_PADL) / (r.width - T_PADL - T_PADR), 0, 1);
}
let scrubbing = false;
function setYearFromX(clientX) {
  let y = yearOfPos(posFromX(clientX));
  if (state.layerId === 'polity') y = Math.min(y, POLITY_END);
  if (y !== state.year) { state.year = y; onYearChanged(); }
}
track.addEventListener('pointerdown', (e) => {
  hideHint(); scrubbing = true;
  try { track.setPointerCapture(e.pointerId); } catch (_) { }
  setYearFromX(e.clientX);
}, { passive: true });
track.addEventListener('pointermove', (e) => { if (scrubbing) setYearFromX(e.clientX); }, { passive: true });
track.addEventListener('pointerup', () => { scrubbing = false; });
track.addEventListener('pointercancel', () => { scrubbing = false; });

/* ───────────── 15. 图层开关 ───────────── */
function setLayer(id) {
  if (state.layerId === id) return;
  state.layerId = id;
  for (const b of layersEl.children) b.classList.toggle('on', b.dataset.layer === id);
  if (id === 'polity' && !polityState.loaded) ensurePolity();
  if (id === 'polity' && state.year > POLITY_END) { /* 允许，图上沿用 2024 边界 */ }
  state.focus = null;
  sheetEl.classList.remove('open');
  rebuildPartition();
  syncHud();
  drawTrack();
  invalidate();
}
layersEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) setLayer(b.dataset.layer);
});

/* ───────────── 16. HUD ───────────── */
function syncHud() {
  const y = state.year;
  elYear.textContent = y >= YMAX ? '今天' : fmtYear(y) + ' 年';
  let txt = y >= YMAX ? '近 ' + TODAY_SPAN + ' 年' : chapterOf(y).n;
  if (state.layerId === 'polity') {
    txt = state.stale ? '政权数据截至 ' + POLITY_END + ' 年' : chapterOf(y).n;
    elSub.innerHTML = txt + ' · <b>' + summary.entities + '</b> 个政权';
  } else {
    elSub.innerHTML = txt + ' · <b>' + summary.countries + '</b> 个国家 · <b>' + summary.ev + '</b> 条记录';
  }
  for (const b of layersEl.children) b.classList.toggle('on', b.dataset.layer === state.layerId);
}
function onYearChanged() {
  rebuildPartition();
  syncHud();
  drawTrack();
  if (!overlay.hidden) openWorld();
  if (state.focus) renderSheet();
  invalidate();
}

function hideHint() { hintEl.classList.add('gone'); }
setTimeout(hideHint, 6000);

/* ───────────── 17. 键盘 ───────────── */
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const step = e.shiftKey ? 20 : 1;
  if (e.key === 'ArrowLeft') { state.year = clamp(state.year - step, YMIN, YMAX); onYearChanged(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { state.year = clamp(state.year + step, YMIN, YMAX); onYearChanged(); e.preventDefault(); }
  else if (e.key === 'Home') { state.year = YMIN; onYearChanged(); e.preventDefault(); }
  else if (e.key === 'End') { state.year = YMAX; onYearChanged(); e.preventDefault(); }
  else if (e.key === 'Escape') { closeWorld(); closeSheet(); }
  else if (e.key === '+') { zoomTo(state.zoom * 1.4); e.preventDefault(); }
  else if (e.key === '-') { zoomTo(state.zoom / 1.4); e.preventDefault(); }
});

/* ───────────── 18. 尺寸 ───────────── */
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { layout(); layoutTrack(); drawTrack(); }, 90);
});
addEventListener('orientationchange', () => setTimeout(() => { layout(); layoutTrack(); drawTrack(); }, 260));
document.addEventListener('visibilitychange', () => { lastT = 0; });

/* ───────────── 19. 启动 ───────────── */
async function loadRelief() {
  const inline = inlineText('relief');
  const src = inline.length > 100 ? 'data:image/jpeg;base64,' + inline.replace(/[^A-Za-z0-9+/=]/g, '') : 'data/relief.jpg';
  await new Promise((res) => {
    const img = new Image();
    img.onload = () => { reliefImg = img; res(); };
    img.onerror = () => res();
    img.src = src;
  });
}

async function ensurePolity() {
  if (polityState.loaded || polityState.loading) return;
  polityState.loading = true;
  loadPill.hidden = false;
  const label = loadPill.querySelector('span');
  try {
    const inline = inlineText('politypack');
    let buf;
    if (inline.length > 100) {
      label.textContent = '政权边界解压…';
      const raw = b64ToBytes(inline);
      buf = (await gunzip(raw)) || raw;
    } else {
      label.textContent = '政权边界 0%';
      const gz = await fetchWithProgress('data/polity.bin.gz', (p) => { label.textContent = '政权边界 ' + Math.round(p * 100) + '%'; });
      label.textContent = '政权边界解压…';
      buf = (await gunzip(gz));
      if (!buf) buf = await (await fetch('data/polity.bin')).arrayBuffer();
    }
    pk = parsePolityBin(buf);
    polityState.loaded = true;
    if (state.layerId === 'polity') { rebuildPartition(); syncHud(); drawTrack(); invalidate(); }
  } catch (err) {
    polityState.error = err.message;
    label.textContent = '政权边界加载失败';
    console.warn('polity load failed', err);
    setTimeout(() => { loadPill.hidden = true; }, 2600);
    return;
  } finally {
    polityState.loading = false;
  }
  loadPill.hidden = true;
}

(async function boot() {
  const world_ = await loadWorld();
  initWorld(world_);
  await loadRelief();
  buildBaseCanvas();
  glr = initGL();
  if (!glr) fallback = initFallback();
  if (glr) { glr.uploadBase(baseCanvas); glr.uploadId(idCanvas); }
  if (fallback) fallback.prepare();

  buildDensity();
  buildCountryPick();
  rebuildPartition();
  layout();
  layoutTrack();
  drawTrack();
  syncHud();
  draw();

  bootEl.classList.add('gone');
  setTimeout(() => { if (bootEl.parentNode) bootEl.remove(); }, 600);
  invalidate();

  /* 空闲时后台把政权边界拉下来，切换图层就不用等 */
  setTimeout(() => { ensurePolity(); }, 2600);
})();

})();

</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
